# CollectAI CI (E1-S5 AC4). Every job here is backed by tooling that exists
# today. `data-safety` (E9-S4) owns tests/redteam and tests/security
# exclusively, and `eval-mock` (E10-S1) owns tests/evaluation exclusively --
# backend-db/backend-unit ignore all three so a db-marked test in any of
# them never runs twice. `e2e` (E11-S5 AC5) runs `frontend/e2e`'s
# accessibility suite (axe scans, keyboard-navigation and focus-management
# tests, WCAG 2.1 AA target -- see `frontend/e2e/accessibility/README.md`
# for that suite's own conformance-claim language) plus the
# `frontend/e2e/journeys` end-to-end specs (E11-S1, E11-S2 and Group K's
# E11-S3, E11-S4), against the real stack.
# Jobs still not added per specs/design/deployment.md section 3 (their
# dependencies do not exist in this repo yet):
#   - openapi-contract (scripts/generate_openapi.py)           -- a later
#                        API-contract story
# MOCK only: no ANTHROPIC_API_KEY is set anywhere in this workflow, and no
# repository secret is required, so LIVE evaluation never runs here --
# `eval-mock`'s own name is a promise `collectai_eval.runner`'s own
# `LiveEvalCiRefusedError` backs structurally, not just by this workflow's
# omission of a key. `e2e` likewise never runs LIVE (`LLM_MODE=MOCK`,
# forced by `docker-compose.test.yml` regardless of `.env`).

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  lint-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -c constraints.txt -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run typecheck

  backend-unit:
    # Everything that does not need a real PostgreSQL instance (tests/unit,
    # tests/ai_guardrails, tests/architecture, ...). The codebase marks only
    # `db` tests explicitly (`pytestmark = pytest.mark.db`); "not db" is
    # therefore the correct complement rather than a `unit` marker that
    # nothing in the suite actually carries. tests/redteam, tests/security
    # and tests/evaluation are ignored here -- `data-safety`/`eval-mock` own
    # them exclusively.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -c constraints.txt -e ".[dev]"
      - run: |
          python -m pytest -m "not db" \
            --ignore=tests/redteam --ignore=tests/security --ignore=tests/evaluation

  backend-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # No postgres service container: tests/db/conftest.py starts its own
      # embedded PostgreSQL instance (embedded-postgres) per test session.
      # tests/redteam, tests/security and tests/evaluation are ignored here
      # -- `data-safety`/`eval-mock` own them exclusively.
      - run: pip install -c constraints.txt -e ".[dev]"
      - run: |
          python -m pytest -m db \
            --ignore=tests/redteam --ignore=tests/security --ignore=tests/evaluation

  data-safety:
    # E9-S4: the prohibited-pattern scan (AC2) plus the red-team (AC1, AC3)
    # and security (AC2, AC4) suites, isolated from backend-unit/backend-db
    # so a scan or red-team failure reports distinctly from an ordinary test
    # failure.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -c constraints.txt -e ".[dev]"
      - run: python scripts/scan_prohibited_patterns.py
      - run: python -m pytest tests/redteam tests/security

  eval-mock:
    # E10-S1: the evaluation dataset/runner/store/report test suite
    # (tests/evaluation), isolated from backend-unit/backend-db so an eval
    # regression reports distinctly. Only ever MOCK here (no ANTHROPIC_API_KEY
    # is set in this workflow, and `collectai_eval.runner` refuses LIVE
    # under CI regardless -- see this file's own top-of-file comment).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -c constraints.txt -e ".[dev]"
      - run: python -m pytest tests/evaluation

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -c constraints.txt -e ".[dev]"
      - run: lint-imports
      - run: python -m pytest tests/architecture

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run test:run
      - run: npm run build

  e2e:
    # E11-S5 AC5: the accessibility suite runs here, against the real
    # stack -- `db` + `migrate` + `api` via docker compose (README.md's own
    # documented bring-up), then Playwright's own `webServer` config starts
    # the Vite dev server, which proxies `/api` to `api`'s published port
    # 8000 (`vite.config.ts`). The `web` (nginx production build) compose
    # service is intentionally not started: the dev server is the one this
    # suite's own `playwright.config.ts` already points at.
    runs-on: ubuntu-latest
    # The workflow default is `backend/`. This job's `cp .env.example .env` and
    # `docker compose` steps belong at the repository root, where `.env.example`
    # and the compose files are, so it overrides the default; its frontend steps
    # set `working-directory: frontend` themselves.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      # E11-S1 AC3 / E11-S5: `docker-compose.test.yml` (E1-S5's own CI/e2e
      # override, already written for exactly this) forces MOCK and enables
      # demo controls regardless of .env -- needed for the journey specs
      # under frontend/e2e/journeys, which drive the demo clock and
      # simulated PAY_NOW (`/api/demo-controls/*`, 404 when disabled).
      - run: docker compose -f docker-compose.yml -f docker-compose.test.yml up --build -d db migrate api
      - name: Wait for the API to report ready
        run: |
          timeout 180 bash -c \
            'until curl -sf http://localhost:8000/api/ready > /dev/null; do sleep 3; done'
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run e2e
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v

  docker-smoke:
    # The compose startup order and the database grants, on a real PostgreSQL:
    # db initialises (roles only) -> migrate -> grants -> api. Covers the
    # fresh-volume start, `/api/ready` (including `app_role_grants`), what
    # `collectai_app` and `collectai_readonly` can and cannot do
    # (`deploy/db/verify-app-grants.sh`), and a restart on the existing volume.
    # MOCK only: `docker-compose.test.yml` forces it, and no API key is set.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.test.yml
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Compose files are valid
        run: docker compose config -q
      - name: Start on a fresh volume (db, migrate, grants, api)
        run: docker compose up --build -d db migrate grants api
      - name: Wait for the API to report ready
        run: |
          timeout 180 bash -c \n            'until curl -sf http://localhost:8000/api/ready > /dev/null; do sleep 3; done'
      - name: Health and readiness
        run: |
          curl -sf http://localhost:8000/api/health
          curl -sf http://localhost:8000/api/ready | tee ready.json
          python3 - <<'PY'
          import json
          body = json.load(open("ready.json"))
          checks = {c["name"]: c["ok"] for c in body["checks"]}
          assert body["status"] == "ready", body
          assert checks.get("app_role_grants") is True, body
          assert all(checks.values()), body
          PY
      - name: Grants work as designed (allowed and intentionally denied)
        run: docker compose exec -T db bash -s < deploy/db/verify-app-grants.sh
      - name: Restart on the existing volume
        run: |
          docker compose down
          docker compose up -d db migrate grants api
          timeout 180 bash -c \n            'until curl -sf http://localhost:8000/api/ready > /dev/null; do sleep 3; done'
          curl -sf http://localhost:8000/api/ready -o ready.json
          grep -Eq '"status": ?"ready"' ready.json
      - name: Grants still hold after the restart
        run: docker compose exec -T db bash -s < deploy/db/verify-app-grants.sh
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
