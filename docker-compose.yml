# CollectAI local runtime (E1-S5). MOCK by default (LLM_MODE from .env).
# One documented command from a clean checkout (README.md):
#   cp .env.example .env && docker compose up --build
# Topology and ports per specs/design/deployment.md section 2.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-change-me}
      POSTGRES_DB: collectai
      COLLECTAI_OWNER_PASSWORD: ${COLLECTAI_OWNER_PASSWORD:-change-me}
      COLLECTAI_APP_PASSWORD: ${COLLECTAI_APP_PASSWORD:-change-me}
      COLLECTAI_READONLY_PASSWORD: ${COLLECTAI_READONLY_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/db/init-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
      - ./deploy/db/init-app-passwords.sh:/docker-entrypoint-initdb.d/02-init-app-passwords.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d collectai"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://collectai_owner:${COLLECTAI_OWNER_PASSWORD:-change-me}@db:5432/collectai
    command: ["sh", "-c", "python -m collectai.bootstrap.cli migrate && python -m collectai.bootstrap.cli seed"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./backend
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready')"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
