[alembic]
# script_location is set programmatically by bootstrap/cli.py and by
# bt/db/conftest.py (folder-structure.md: migrations live under
# src/collectai/persistence/migrations, not the conventional repo-root
# alembic/ directory), but a static default is provided here too so
# `alembic <cmd>` works unmodified from backend/ for local development.
script_location = src/collectai/persistence/migrations
prepend_sys_path = src
path_separator = os
version_path_separator = os

# sqlalchemy.url is intentionally left unset here: it is always supplied at
# runtime from Settings.database_url (bootstrap/cli.py) or from the test
# harness (bt/db/conftest.py), never hard-coded, so no real or dev credential
# is ever committed.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
