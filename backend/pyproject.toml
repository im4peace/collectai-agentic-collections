[project]
name = "collectai"
version = "0.1.0"
description = "CollectAI backend: AI-native Collections & Recovery platform (portfolio/demo project). Synthetic data only."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
    "anthropic>=0.34,<1",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.9",
    "ruff>=0.4",
    "embedded-postgres>=18.0",
    "import-linter>=2.0",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collectai", "src/collectai_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "unit: pure unit tests with no I/O",
    "db: tests that require a real PostgreSQL instance (embedded-postgres)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_unused_ignores = true
