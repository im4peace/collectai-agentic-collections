# Serves the built SPA and proxies /api to the backend (E1-S5). Same origin
# as the browser sees it, so the API needs no CORS configuration for the
# `web` -> `api` path (deployment.md section 2).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Basic security headers (portfolio-scope: no CSP fine-tuning yet, that
    # is a UI story's concern once real external resources are known).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: any non-file, non-/api/ route serves index.html so
    # client-side routing (added by later UI stories) works on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
