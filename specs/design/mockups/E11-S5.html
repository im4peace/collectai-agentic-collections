<title>E11-S5 Accessibility verification report - CollectAI mockup</title>
<!--

  Self-contained: inline CSS and vanilla JS only, no CDN, no web fonts, no network calls.
  Synthetic data only (fictional names, example.com, +1-555-01xx). Payments are simulated.
  Field names, enums and shapes follow specs/design/api-contracts.md (snake_case, money as 2dp strings).

<div class="mockbar" data-bg>

<script>
/* ---- shared mockup helpers (inlined per file; no external deps) ---- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=l=>`<span class="api" data-api="${esc(l)}" title="API call">${esc(l)}</span>`;
const money=s=>{const m=String(s).match(/^(-?)(\d+)\.(\d{2})$/);return m?`${m[1]}AED ${m[2].replace(/\B(?=(\d{3})+(?!\d))/g,',')}.${m[3]}`:esc(s)};
const cents=s=>{const m=String(s).trim().match(/^(\d+)(?:\.(\d{1,2}))?$/);return m?BigInt(m[1])*100n+BigInt((m[2]||'').padEnd(2,'0')||'0'):null};
const fromCents=c=>{const n=c<0n?-c:c;const s=n.toString().padStart(3,'0');return (c<0n?'-':'')+s.slice(0,-2)+'.'+s.slice(-2)};
const pct4=v=>{if(v==null)return '-';const [i,f='']=String(v).split('.');const n=BigInt(i+f.padEnd(4,'0').slice(0,4));const s=n.toString().padStart(3,'0');return s.slice(0,-2)+'.'+s.slice(-2)+'%'};
const fmtDT=t=>{if(!t)return '-';const d=new Date(t),z=new Date(d.getTime()+14400000),p=n=>String(n).padStart(2,'0');return `${z.getUTCFullYear()}-${p(z.getUTCMonth()+1)}-${p(z.getUTCDate())} ${p(z.getUTCHours())}:${p(z.getUTCMinutes())} GST`};
const PN={CUSTOMER:'Customer',COLLECTIONS_OFFICER:'Collections Officer',COLLECTIONS_MANAGER:'Collections Manager',COMPLIANCE_RISK:'Compliance and Risk'};
const NAV={CUSTOMER:[['Chat','/chat']],COLLECTIONS_OFFICER:[['Portfolio','/portfolio'],['Customer 360','/customers/acc_000123'],['Escalations','/escalations'],['Review queues','/review-queues'],['Demo controls','/demo-controls',true]],COLLECTIONS_MANAGER:[['Dashboard','/dashboard']],COMPLIANCE_RISK:[['Audit Trail','/audit'],['Compliance review queue','/compliance-review']]};
const chip=(t,c,i)=>`<span class="chip ${c}">${i?`<span aria-hidden="true">${i}</span>`:''}${esc(t)}</span>`;
const bandChip=b=>({HIGH:chip('HIGH priority','danger','▲'),MEDIUM:chip('MEDIUM priority','warn','◆'),LOW:chip('LOW priority','ok','▼')}[b]);

const banner=(k,html,icon,role)=>`<div class="banner ${k}" ${role===false?'':`role="${role||(k==='danger'?'alert':'status')}"`}><span class="bi" aria-hidden="true">${icon||({warn:'⚠',danger:'✖',info:'ℹ',ok:'✔',ai:'✦'}[k])}</span><div>${html}</div></div>`;
const errBox=(status,code,reason,msg,extra)=>banner('danger',`<strong>${status} ${esc(code)}${reason?' / '+esc(reason):''}</strong><br>${esc(msg)}${extra?'<br>'+extra:''}<br><span class="small muted">correlation_id: <code>c0ffee1234abcd</code></span>`);
function announce(msg){const l=$('#sr-live');l.textContent='';setTimeout(()=>{l.textContent=msg},40)}
let _tt;function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(_tt);_tt=setTimeout(()=>{t.hidden=true},3200);announce(msg)}
function setShell(persona,current,opts={}){
  const layout=persona==='CUSTOMER'?'Customer':'Internal';
  const nav=(NAV[persona]||[]).filter(n=>!n[2]||opts.demoFlag);
  $('#appbar').innerHTML=`<div class="brand"><span aria-hidden="true">◈</span> CollectAI <span class="env">${layout} layout</span></div>
  <nav aria-label="Main navigation">${nav.map(n=>`<a href="${n[1]}" data-route="${n[1]}" ${n[0]===current?'aria-current="page"':''}>${n[0]}</a>`).join('')}</nav>
  <div class="who"><span class="chip demo">Demo persona - not real authentication</span><span id="persona-chip" role="status" aria-live="polite">Current persona: <strong>${PN[persona]}</strong> <code>${persona}</code></span></div>`;
}
document.addEventListener('click',e=>{const a=e.target.closest('a[data-route]');if(a){e.preventDefault();if(window.onRoute)window.onRoute(a.dataset.route,a.textContent);else toast('Mockup: would navigate to '+a.dataset.route)}});

function openDialog({title,body,trigger,restore,focusSel,onMount}){
  const prev=trigger||document.activeElement;
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t" tabindex="-1"><h2 id="dlg-t">${title}</h2><div>${body}</div></div>`;
  document.body.appendChild(ov);const dlg=ov.firstElementChild;
  const bg=$$('[data-bg]');bg.forEach(e=>{e.inert=true;e.setAttribute('aria-hidden','true')});
  const foc=()=>$$('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])',dlg).filter(e=>!e.hidden);
  function close(){document.removeEventListener('keydown',key,true);ov.remove();bg.forEach(e=>{e.inert=false;e.removeAttribute('aria-hidden')});
    const t=document.contains(prev)?prev:(restore?$(restore):null);if(t&&t.focus)t.focus()}

      if(e.shiftKey&&(a===f[0]||!dlg.contains(a))){e.preventDefault();f[f.length-1].focus()}

  document.addEventListener('keydown',key,true);
  if(onMount)onMount(dlg,close);
  const fi=(focusSel&&$(focusSel,dlg))||foc()[0]||dlg;fi.focus();
  return close;
}

 ['Rules engine','Rules engine','rules','▦','Priority, eligibility, payable amounts'],
 ['Risk','Vulnerable customer flag','risk','⚠','Vulnerability, escalation and compliance markers'],
 ['Priority','HIGH priority','prio','▲','Portfolio, Customer 360, escalation queues'],
 ['Simulated','Simulated payment','sim','◇','Chat, payment history, demo controls']];
let filter='all',openRows={},gray=false;
function resetState(){filter='all';openRows={};gray=false}
const sample=(cls,icon,text)=>cls==='ai'?`<span class="tag ai"><span aria-hidden="true">${icon}</span>${text}</span>`:cls==='rules'?`<span class="tag rules"><span aria-hidden="true">${icon}</span>${text}</span>`:cls==='sim'?`<span class="tag sim"><span aria-hidden="true">${icon}</span>${text}</span>`:cls==='risk'?chip(text,'danger',icon):chip(text,'danger',icon);
function render(){
  const st=$('#mock-state').value;
  setShell('COLLECTIONS_OFFICER','',{demoFlag:true});
  const head=`<div class="pagehead"><div><h1>Accessibility verification</h1><p class="muted">Automated axe, keyboard, focus and label checks run in CI on every primary screen delivered so far.</p></div><div><span class="api" data-api="none: reads CI artifact reports/a11y/summary.json">No API call: CI artifact reports/a11y/summary.json</span></div></div>`;
  const disclaimer=banner('info','<strong>Standard: WCAG 2.1 AA is a target.</strong> This product targets WCAG 2.1 AA and makes no conformance claim. Automated checks cannot find every issue.',null,false);
  if(st==='empty'){$('#main').innerHTML=head+disclaimer+`<div class="empty" role="status"><strong>No accessibility report found.</strong><p>Run <code>npx playwright test tests/a11y</code> or wait for the CI job. The suite writes <code>reports/a11y/summary.json</code>.</p></div>`;return}
  const fail=st==='fail';const S=report(fail);
  const sev=s=>s.axe.serious+s.axe.critical;
  const totalSev=S.reduce((a,s)=>a+sev(s),0);
  const kt=S.reduce((a,s)=>a+s.keyboard.length,0),kp=S.reduce((a,s)=>a+s.keyboard.filter(t=>t.passed).length,0);
  const ft=S.reduce((a,s)=>a+s.focus.length,0),fp=S.reduce((a,s)=>a+s.focus.filter(t=>t.passed).length,0);
  const overall=totalSev===0&&kp===kt&&fp===ft;
  const status=overall?banner('ok','<strong>CI status: PASS.</strong> No serious or critical axe violations; all keyboard, focus and label tests passed.','✔','status'):banner('danger',`<strong>CI status: FAIL.</strong> ${totalSev} serious or critical axe violation${totalSev===1?'':'s'}${fp<ft?` and ${ft-fp} failing focus test${ft-fp===1?'':'s'}`:''}. The build is blocked until fixed.`);
  const tiles=`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin:10px 0">${[['Screens scanned',S.length+' of '+S.length,'ok'],['Serious or critical axe',String(totalSev),totalSev?'bad':'ok'],['Keyboard tests',kp+' / '+kt,kp===kt?'ok':'bad'],['Focus and live-region tests',fp+' / '+ft,fp===ft?'ok':'bad'],['State label checks',LABELS.length+' / '+LABELS.length,'ok']].map(t=>`<div class="panel stat"><span class="l">${t[0]}</span><span class="v">${t[1]}</span><span>${t[2]==='ok'?chip('Pass','ok','✔'):chip('Fail','danger','✖')}</span></div>`).join('')}</div>`;
  const rows=S.filter(s=>filter==='all'||sev(s)>0||s.keyboard.some(t=>!t.passed)||s.focus.some(t=>!t.passed));
  const tbl=`<div class="row" style="margin:14px 0 6px;justify-content:space-between"><h2 style="margin:0">Per-screen results</h2><div class="seg" role="group" aria-label="Filter results"><button type="button" data-f="all" aria-pressed="${filter==='all'}">All screens</button><button type="button" data-f="fail" aria-pressed="${filter==='fail'}">Failing only</button></div></div>
   ${rows.length?`<div class="tablewrap"><table><caption class="sr">Accessibility results per screen</caption><thead><tr><th scope="col">Screen</th><th scope="col">axe: serious / critical</th><th scope="col">Keyboard</th><th scope="col">Focus and live region</th><th scope="col">Result</th></tr></thead><tbody>${rows.map(s=>{
     const ok=sev(s)===0&&s.keyboard.every(t=>t.passed)&&s.focus.every(t=>t.passed);const o=openRows[s.screen_id];
     return `<tr><td><button type="button" class="row-btn" data-row="${s.screen_id}" aria-expanded="${!!o}" aria-controls="d-${s.screen_id}">${s.name}</button><br><span class="small muted">${s.story} &middot; <code>${s.route}</code></span></td><td>${sev(s)?chip(sev(s)+' violation'+(sev(s)>1?'s':''),'danger','✖'):chip('0','ok','✔')}<br><span class="small muted">${s.axe.moderate} moderate, ${s.axe.minor} minor (reported, not blocking)</span></td><td>${s.keyboard.filter(t=>t.passed).length} / ${s.keyboard.length}</td><td>${s.focus.length?s.focus.filter(t=>t.passed).length+' / '+s.focus.length:'<span class="muted">No dialogs</span>'}</td><td>${ok?chip('Pass','ok','✔'):chip('Fail','danger','✖')}</td></tr>
     <tr id="d-${s.screen_id}" ${o?'':'hidden'}><td colspan="5"><strong>Keyboard tests</strong><ul class="tests">${s.keyboard.map(t=>`<li>${t.passed?chip('Pass','ok','✔'):chip('Fail','danger','✖')} ${t.name}</li>`).join('')}</ul>${s.focus.length?`<strong>Focus and live-region tests</strong><ul class="tests">${s.focus.map(t=>`<li>${t.passed?chip('Pass','ok','✔'):chip('Fail','danger','✖')} ${t.name}${t.detail?' <span class="small muted">('+t.detail+')</span>':''}</li>`).join('')}</ul>`:''}${(s.violations||[]).map(v=>banner('danger',`<strong>${v.impact} - ${v.rule}</strong><br><code>${v.target}</code><br>${v.help}`)).join('')}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty" role="status">No failing screens.</div>'}`;
  const lab=`<section class="panel" style="margin-top:16px" aria-labelledby="lh"><div class="ph"><h2 id="lh">Meaning is never carried by color alone</h2><span class="api" data-api="none">No API call</span></div><p class="small muted">A test asserts each state below has a visible text label and an icon. The grayscale preview shows the labels still read without color.</p>
   <button type="button" class="btn secondary" id="gray" aria-pressed="${gray}">${gray?'Show in color':'Preview in grayscale'}</button>
   <div class="tablewrap ${gray?'gray':''}" style="margin-top:8px"><table class="tight"><caption class="sr">State label checks</caption><thead><tr><th scope="col">State</th><th scope="col">Rendered as</th><th scope="col">Text label</th><th scope="col">Used in</th><th scope="col">Check</th></tr></thead><tbody>${LABELS.map(l=>`<tr><td>${l[0]}</td><td>${sample(l[2],l[3],l[1])}</td><td><code>${l[1]}</code></td><td class="small">${l[4]}</td><td>${chip('Text and icon','ok','✔')}</td></tr>`).join('')}</tbody></table></div></section>`;
  const meta=`<p class="footnote">Run <code>a11y-2026-10-01-0007</code> &middot; commit <code>9f3c2ab</code> &middot; axe-core with Playwright &middot; ${fmtDT('2026-10-01T14:12:00Z')} &middot; Screens from later slices are added as they ship. Report statement: <em>targets WCAG 2.1 AA, no conformance claim</em>.</p>`;
  $('#main').innerHTML=head+disclaimer+status+tiles+tbl+lab+meta;
  $$('button[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render();const n=$(`button[data-f="${filter}"]`);if(n)n.focus();announce('Showing '+(filter==='all'?'all screens':'failing screens only'))});
  $$('button[data-row]').forEach(b=>b.onclick=()=>{const id=b.dataset.row;openRows[id]=!openRows[id];render();const n=$(`button[data-row="${id}"]`);if(n)n.focus()});
  $('#gray').onclick=()=>{gray=!gray;render();$('#gray').focus();announce(gray?'Grayscale preview on':'Grayscale preview off')};
}

initMockbar();
$('#mock-state').addEventListener('change',()=>{if(typeof resetState==='function')resetState();render()});
render();
</script>
</body>
</html>
