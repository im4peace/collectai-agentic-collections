<title>E9-S2 Audit Trail Viewer - CollectAI mockup</title>
<!--
  Mockup for story E9-S2: Audit Trail Viewer
  Self-contained: inline CSS and vanilla JS only, no CDN, no web fonts, no network calls.
  Synthetic data only (fictional names, example.com, +1-555-01xx). Payments are simulated.
  Field names, enums and shapes follow specs/design/api-contracts.md (snake_case, money as 2dp strings).
  Contract gaps noted while building this mockup:
  - AuditEvent.event_type is a free string with no catalogue, so stage labels come from the AuditStage enum only.
  - The viewer needs two calls (GET /api/audit/chains then GET /api/audit?correlation_id=); AuditChainSummary has no customer name.
  - AuditEvent.human_override and rule_results are untyped objects, so the mockup shows them as redacted JSON.
-->

<div class="mockbar" data-bg>

<script>
/* ---- shared mockup helpers (inlined per file; no external deps) ---- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=l=>`<span class="api" data-api="${esc(l)}" title="API call">${esc(l)}</span>`;
const money=s=>{const m=String(s).match(/^(-?)(\d+)\.(\d{2})$/);return m?`${m[1]}$${m[2].replace(/\B(?=(\d{3})+(?!\d))/g,',')}.${m[3]}`:esc(s)};
const cents=s=>{const m=String(s).trim().match(/^(\d+)(?:\.(\d{1,2}))?$/);return m?BigInt(m[1])*100n+BigInt((m[2]||'').padEnd(2,'0')||'0'):null};
const fromCents=c=>{const n=c<0n?-c:c;const s=n.toString().padStart(3,'0');return (c<0n?'-':'')+s.slice(0,-2)+'.'+s.slice(-2)};
const pct4=v=>{if(v==null)return '-';const [i,f='']=String(v).split('.');const n=BigInt(i+f.padEnd(4,'0').slice(0,4));const s=n.toString().padStart(3,'0');return s.slice(0,-2)+'.'+s.slice(-2)+'%'};
const fmtDT=t=>t?esc(String(t).replace('T',' ').replace(/:\d\dZ$/,' UTC')):'-';
const PN={CUSTOMER:'Customer',COLLECTIONS_OFFICER:'Collections Officer',COLLECTIONS_MANAGER:'Collections Manager',COMPLIANCE_RISK:'Compliance and Risk'};
const NAV={CUSTOMER:[['Chat','/chat']],COLLECTIONS_OFFICER:[['Portfolio','/portfolio'],['Customer 360','/customers/acc_000123'],['Escalations','/escalations'],['Review queues','/review-queues'],['Demo controls','/demo-controls',true]],COLLECTIONS_MANAGER:[['Dashboard','/dashboard']],COMPLIANCE_RISK:[['Audit Trail','/audit'],['Compliance review queue','/compliance-review']]};
const chip=(t,c,i)=>`<span class="chip ${c}">${i?`<span aria-hidden="true">${i}</span>`:''}${esc(t)}</span>`;
const bandChip=b=>({HIGH:chip('HIGH priority','danger','▲'),MEDIUM:chip('MEDIUM priority','warn','◆'),LOW:chip('LOW priority','ok','▼')}[b]);
const TAGS={rules:['▦','Rules engine'],ai:['✦','AI-generated'],sim:['◇','Simulated'],rec:['▤','System record']};
const tag=k=>`<span class="tag ${k}"><span aria-hidden="true">${TAGS[k][0]}</span>${TAGS[k][1]}</span>`;
const banner=(k,html,icon,role)=>`<div class="banner ${k}" ${role===false?'':`role="${role||(k==='danger'?'alert':'status')}"`}><span class="bi" aria-hidden="true">${icon||({warn:'⚠',danger:'✖',info:'ℹ',ok:'✔',ai:'✦'}[k])}</span><div>${html}</div></div>`;
const errBox=(status,code,reason,msg,extra)=>banner('danger',`<strong>${status} ${esc(code)}${reason?' / '+esc(reason):''}</strong><br>${esc(msg)}${extra?'<br>'+extra:''}<br><span class="small muted">correlation_id: <code>c0ffee1234abcd</code></span>`);
function announce(msg){const l=$('#sr-live');l.textContent='';setTimeout(()=>{l.textContent=msg},40)}
let _tt;function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(_tt);_tt=setTimeout(()=>{t.hidden=true},3200);announce(msg)}
function setShell(persona,current,opts={}){
  const layout=persona==='CUSTOMER'?'Customer':'Internal';
  const nav=(NAV[persona]||[]).filter(n=>!n[2]||opts.demoFlag);
  $('#appbar').innerHTML=`<div class="brand"><span aria-hidden="true">◈</span> CollectAI <span class="env">${layout} layout</span></div>
  <nav aria-label="Main navigation">${nav.map(n=>`<a href="${n[1]}" data-route="${n[1]}" ${n[0]===current?'aria-current="page"':''}>${n[0]}</a>`).join('')}</nav>
  <div class="who"><span class="chip demo">Demo persona - not real authentication</span><span id="persona-chip" role="status" aria-live="polite">Current persona: <strong>${PN[persona]}</strong> <code>${persona}</code></span></div>`;
}
document.addEventListener('click',e=>{const a=e.target.closest('a[data-route]');if(a){e.preventDefault();if(window.onRoute)window.onRoute(a.dataset.route,a.textContent);else toast('Mockup: would navigate to '+a.dataset.route)}});
const forbiddenPage=(persona,route)=>`<section class="forbidden" role="alert" aria-labelledby="fh"><h1 id="fh"><span aria-hidden="true">⛔</span> 403 - Forbidden</h1><p>The persona <strong>${esc(persona)}</strong> cannot open <code>${esc(route)}</code>.</p><p class="muted">No restricted data was requested or rendered. The API would answer <code>403 FORBIDDEN</code> and write an <code>ACCESS_DENIED</code> audit event.</p>${api('403 FORBIDDEN (no data fetched)')}</section>`;
function openDialog({title,body,trigger,restore,focusSel,onMount}){
  const prev=trigger||document.activeElement;
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t" tabindex="-1"><h2 id="dlg-t">${title}</h2><div>${body}</div></div>`;
  document.body.appendChild(ov);const dlg=ov.firstElementChild;
  const bg=$$('[data-bg]');bg.forEach(e=>{e.inert=true;e.setAttribute('aria-hidden','true')});
  const foc=()=>$$('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])',dlg).filter(e=>!e.hidden);
  function close(){document.removeEventListener('keydown',key,true);ov.remove();bg.forEach(e=>{e.inert=false;e.removeAttribute('aria-hidden')});
    const t=document.contains(prev)?prev:(restore?$(restore):null);if(t&&t.focus)t.focus()}
  function key(e){
    if(e.key==='Escape'){e.stopPropagation();close();return}
    if(e.key==='Tab'){const f=foc();if(!f.length){e.preventDefault();return}const a=document.activeElement;
      if(e.shiftKey&&(a===f[0]||!dlg.contains(a))){e.preventDefault();f[f.length-1].focus()}
      else if(!e.shiftKey&&(a===f[f.length-1]||!dlg.contains(a))){e.preventDefault();f[0].focus()}}}
  document.addEventListener('keydown',key,true);
  if(onMount)onMount(dlg,close);
  const fi=(focusSel&&$(focusSel,dlg))||foc()[0]||dlg;fi.focus();
  return close;
}
function initMockbar(){

}

const chainsOf=arr=>{const m={};arr.forEach(e=>{(m[e.correlation_id]=m[e.correlation_id]||[]).push(e)});return Object.keys(m).map(k=>{const es=m[k].sort((a,b)=>a.sequence-b.sequence);const ai=es.find(e=>e.stage==='AI_INTERPRETATION');const last=es[es.length-1];return {correlation_id:k,account_id:es[0].account_id,started_at:es[0].timestamp,last_event_at:last.timestamp,event_count:es.length,stages_present:[...new Set(es.map(e=>e.stage))],final_action:last.final_action,policy_version:'policy-v1',model_id:ai?ai.model_id:null,prompt_version:ai?ai.prompt_version:null}}).sort((a,b)=>a.started_at<b.started_at?1:-1)};
let Q={by:'account_id',val:'acc_000123',searched:true,chain:null,err:null},open={};
function resetState(){Q={by:'account_id',val:'acc_000123',searched:true,chain:null,err:null};open={}}
const actorChip=e=>e.actor_kind==='AI'?chip('AI','ai','✦'):e.actor_kind==='STAFF'?chip('Staff: '+e.actor_persona,'info','☺'):e.actor_kind==='CUSTOMER'?chip('Customer','neutral','☺'):chip('System','neutral','⚙');
function render(){
  const st=$('#mock-state').value;
  if(st==='forbidden'){setShell('COLLECTIONS_OFFICER','');$('#main').innerHTML=forbiddenPage('COLLECTIONS_OFFICER','/audit');return}
  setShell('COMPLIANCE_RISK','Audit Trail',{demoFlag:true});
  const head=`<div class="pagehead"><div><h1>Audit trail</h1><p class="muted">Follow one decision from the customer's message to the final state. Read-only: audit records cannot be edited or deleted, and the API has no write route for them.</p></div><div>${api('GET /api/audit/chains')} ${api('GET /api/audit')}<br>${chip('Read-only','neutral','▣')}</div></div>`;
  const form=`<form class="panel" id="sf" novalidate><div class="ph"><h2>Find a decision chain</h2></div><div class="row" style="align-items:flex-end"><label class="f">Search by<select id="by"><option value="account_id" ${Q.by==='account_id'?'selected':''}>Account id (account_id)</option><option value="correlation_id" ${Q.by==='correlation_id'?'selected':''}>Correlation id (correlation_id)</option></select></label><label class="f" style="flex:1;min-width:220px">Value<input id="val" value="${esc(Q.val)}" autocomplete="off" placeholder="acc_000123 or c0ffee1234abcd"></label><button type="submit" class="btn">Search</button></div><p class="small muted" style="margin:6px 0 0">Try <code>acc_000123</code>, <code>acc_000206</code> or correlation id <code>c0ffee1234abcd</code>. Requests: <code>GET /api/audit/chains?account_id=...</code> then <code>GET /api/audit?correlation_id=...</code></p></form>`;
  let body='';
  if(Q.err)body=Q.err;
  else if(Q.searched){
    let chains=st==='empty'?[]:chainsOf(EVENTS);
    if(st==='error')body=errBox(500,'INTERNAL_ERROR',null,'The audit read failed. No events are shown; nothing was changed.','<button type="button" class="btn secondary" id="retry">Retry</button>');
    else{
      if(Q.by==='account_id')chains=chains.filter(c=>c.account_id===Q.val.trim());else chains=chains.filter(c=>c.correlation_id===Q.val.trim());
      if(!chains.length)body=`<div class="empty" role="status"><strong>No decision chains found for ${esc(Q.val)}.</strong><p>Check the id, or search by the other field.</p></div>`;
      else{
        if(!Q.chain||!chains.find(c=>c.correlation_id===Q.chain))Q.chain=chains[0].correlation_id;
        body=`<section class="panel" aria-labelledby="ch" style="margin:14px 0"><div class="ph"><h2 id="ch">Chains (${chains.length})</h2>${api('GET /api/audit/chains')}</div><div class="tablewrap"><table class="tight"><caption class="sr">Decision chains. Select one to view its timeline.</caption><thead><tr><th scope="col">Correlation id</th><th scope="col">Started</th><th scope="col" class="num">Events</th><th scope="col">Stages present</th><th scope="col">Final action</th></tr></thead><tbody>${chains.map(c=>`<tr ${Q.chain===c.correlation_id?'aria-current="true"':''}><td><button type="button" class="btn link" data-chain="${c.correlation_id}"><code>${c.correlation_id}</code></button></td><td>${fmtDT(c.started_at)}</td><td class="num">${c.event_count}</td><td class="small">${c.stages_present.map(s=>STAGES.find(x=>x[0]===s)[1]).join(', ')}</td><td>${esc(c.final_action||'-')}</td></tr>`).join('')}</tbody></table></div></section>`;
        if(Q.chain)body+=timeline(Q.chain);else body+='<p class="muted">Select a chain to see its timeline.</p>';
      }
    }
  }
  $('#main').innerHTML=head+form+`<div id="res" aria-live="polite">${body}</div>`;
  wire();
}
function timeline(corr){
  const es=EVENTS.filter(e=>e.correlation_id===corr).sort((a,b)=>a.sequence-b.sequence);
  const items=STAGES.map((s,i)=>{
    const list=es.filter(e=>e.stage===s[0]);const id='st-'+s[0];
    if(!list.length)return `<li class="miss"><div class="sh" role="group" aria-label="Stage ${i+1}: ${s[1]}, not present in this chain"><span aria-hidden="true">${s[2]}</span> Stage ${i+1}: ${s[1]} <span class="chip neutral">Not present in this chain</span></div></li>`;
    const isOpen=open[corr+s[0]]!==false;
    return `<li><h3 style="margin:0"><button type="button" class="sh" aria-expanded="${isOpen}" aria-controls="${id}" data-stage="${corr+s[0]}"><span aria-hidden="true">${s[2]}</span> Stage ${i+1}: ${s[1]} <span class="chip neutral">${list.length} event${list.length>1?'s':''}</span></button></h3><div id="${id}" ${isOpen?'':'hidden'}>${list.map(evHtml).join('')}</div></li>`}).join('');
  return `<section class="panel" aria-labelledby="th"><div class="ph"><h2 id="th">Decision chain <code>${corr}</code></h2>${api('GET /api/audit?correlation_id='+corr)}</div><p class="small muted">Ordered by timestamp, then sequence. Six stages, always shown in this order. Use Tab to move between stages, Up/Down arrows also work, Enter or Space expands a stage.</p><ol class="tl" aria-label="Decision chain, six stages">${items}</ol></section>`;
}
function evHtml(e){
  const ai=e.actor_kind==='AI';
  const ver=ai?`<div class="ver" aria-label="Versions used by this AI step"><span><strong>model_id</strong> ${esc(e.model_id||'null')}</span><span><strong>prompt_version</strong> ${esc(e.prompt_version||'null')}</span><span><strong>PolicyRuleSet</strong> ${esc(e.policy_version||'null')}</span><span><strong>mode</strong> ${e.provider_mode||'-'}</span></div>`:(e.policy_version?`<div class="ver"><span><strong>PolicyRuleSet</strong> ${esc(e.policy_version)}</span></div>`:'');
  const extra={};['capability','provider','ai_output','tool_calls','rule_results','human_override','input_ref','final_action','reason_code','resource_type','resource_id','latency','token_usage'].forEach(k=>{const v=e[k];if(v!==null&&!(Array.isArray(v)&&!v.length))extra[k]=v});
  return `<article class="ev ${ai?'ai':''}" aria-label="${esc(e.event_type)}"><div class="row" style="justify-content:space-between"><strong>${esc(e.event_type)}</strong><span>${ai?tag('ai'):e.stage==='RULE_VALIDATION'?tag('rules'):''} ${actorChip(e)}</span></div><div class="small muted">${fmtDT(e.timestamp)} &middot; seq ${e.sequence} &middot; <span class="mono">${e.audit_event_id}</span></div>${ver}${e.human_override?`<p style="margin:6px 0 0"><strong>Human override:</strong> ${esc(e.human_override.reason)}</p>`:''}<details style="margin-top:6px"><summary>Redacted details (read-only)</summary><pre>${esc(JSON.stringify(extra,null,2))}</pre></details></article>`;
}
function wire(){
  $('#sf').addEventListener('submit',e=>{e.preventDefault();Q.by=$('#by').value;Q.val=$('#val').value;Q.chain=null;open={};
    if(!Q.val.trim()){Q.err=errBox(422,'VALIDATION_ERROR','FILTER_REQUIRED','At least one of correlation_id or account_id is required.');Q.searched=true}else{Q.err=null;Q.searched=true}
    render();const r=$('#res');announce(Q.err?'Search needs a value':'Search complete');const b=$('button[data-chain]');});
  $$('button[data-chain]').forEach(b=>b.onclick=()=>{Q.chain=b.dataset.chain;render();const t=$('#th');if(t){t.setAttribute('tabindex','-1');t.focus()}announce('Timeline loaded for '+Q.chain)});
  $$('button[data-stage]').forEach(b=>{b.onclick=()=>{const k=b.dataset.stage;open[k]=!(open[k]!==false);render();const n=$(`button[data-stage="${k}"]`);if(n)n.focus()};
    b.addEventListener('keydown',e=>{const all=$$('button[data-stage]');const i=all.indexOf(b);let n=null;if(e.key==='ArrowDown')n=all[i+1];else if(e.key==='ArrowUp')n=all[i-1];else if(e.key==='Home')n=all[0];else if(e.key==='End')n=all[all.length-1];if(n){e.preventDefault();n.focus()}})});
  const r=$('#retry');if(r)r.onclick=()=>toast('Mockup: retry would call GET /api/audit');
}

initMockbar();
$('#mock-state').addEventListener('change',()=>{if(typeof resetState==='function')resetState();render()});
render();
</script>
