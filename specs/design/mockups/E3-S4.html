<title>E3-S4 Persona switcher and role-based navigation - CollectAI mockup</title>
<!--
  Mockup for story E3-S4: Persona switcher and role-based navigation
  Self-contained: inline CSS and vanilla JS only, no CDN, no web fonts, no network calls.
  Synthetic data only (fictional names, example.com, +1-555-01xx). Payments are simulated.
  Field names, enums and shapes follow specs/design/api-contracts.md (snake_case, money as 2dp strings).
  Contract gaps noted while building this mockup:
  - No endpoint or field maps capabilities to routes; the nav and the forbidden route guard use a client-side capability to route table.
  - COLLECTIONS_OFFICER and COMPLIANCE_RISK both hold escalation:read, so capabilities alone cannot decide who may open the officer-only escalation list route; the mockup guards it on escalation:review.
  - Whether demo controls appear in the officer nav is driven by MetaInfo.demo_controls_enabled (GET /api/meta), which is not among the calls listed for E3-S4.
-->
<style>

:root[data-theme=dark]{--bg:#0d1620;--surface:#15212d;--surface2:#1d2c3b;--text:#e8eef4;--muted:#a9b7c4;--line:#34475b;--brand:#62b6ea;--brand-ink:#05131d;--ai:#c8b5ff;--ai-bg:#251b40;--rule:#8ccbf0;--rule-bg:#12293a;--warn:#ffd27a;--warn-bg:#3a2a08;--danger:#ffa19b;--danger-bg:#3d1614;--ok:#84e0a4;--ok-bg:#0f2e1d;--sim:#ffd08a;--sim-bg:#3b2907;--focus:#8ab8ff;--shadow:none;color-scheme:dark}

.tablewrap{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:8px}

<body>
<a class="skip" href="#main">Skip to main content</a>
<div class="mockbar" data-bg>
  <strong>Mockup E3-S4</strong><span class="muted">controls below are not part of the product UI</span>
  <label>State: <select id="mock-state" aria-label="Mockup state toggle">
<option value="happy">Happy path: options loaded</option>
<option value="nocustomers">Empty: no seeded demo customers</option>
<option value="error">Error: options request failed (503)</option>
  </select></label>
  <button type="button" class="btn secondary" id="theme-btn" style="min-height:28px;padding:2px 10px">Theme: toggle light/dark</button>
</div>
<div id="root" data-bg>
  <header class="appbar" id="appbar"></header>
  <main id="main" tabindex="-1"></main>
</div>
<div id="sr-live" class="sr" aria-live="polite" aria-atomic="true"></div>
<div id="toast" class="toast" role="status" hidden></div>
<script>
/* ---- shared mockup helpers (inlined per file; no external deps) ---- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=l=>`<span class="api" data-api="${esc(l)}" title="API call">${esc(l)}</span>`;
const money=s=>{const m=String(s).match(/^(-?)(\d+)\.(\d{2})$/);return m?`${m[1]}AED ${m[2].replace(/\B(?=(\d{3})+(?!\d))/g,',')}.${m[3]}`:esc(s)};
const cents=s=>{const m=String(s).trim().match(/^(\d+)(?:\.(\d{1,2}))?$/);return m?BigInt(m[1])*100n+BigInt((m[2]||'').padEnd(2,'0')||'0'):null};
const fromCents=c=>{const n=c<0n?-c:c;const s=n.toString().padStart(3,'0');return (c<0n?'-':'')+s.slice(0,-2)+'.'+s.slice(-2)};
const pct4=v=>{if(v==null)return '-';const [i,f='']=String(v).split('.');const n=BigInt(i+f.padEnd(4,'0').slice(0,4));const s=n.toString().padStart(3,'0');return s.slice(0,-2)+'.'+s.slice(-2)+'%'};
const fmtDT=t=>{if(!t)return '-';const d=new Date(t),z=new Date(d.getTime()+14400000),p=n=>String(n).padStart(2,'0');return `${z.getUTCFullYear()}-${p(z.getUTCMonth()+1)}-${p(z.getUTCDate())} ${p(z.getUTCHours())}:${p(z.getUTCMinutes())} GST`};
const PN={CUSTOMER:'Customer',COLLECTIONS_OFFICER:'Collections Officer',COLLECTIONS_MANAGER:'Collections Manager',COMPLIANCE_RISK:'Compliance and Risk'};
const NAV={CUSTOMER:[['Chat','/chat']],COLLECTIONS_OFFICER:[['Portfolio','/portfolio'],['Customer 360','/customers/acc_000123'],['Escalations','/escalations'],['Review queues','/review-queues'],['Demo controls','/demo-controls',true]],COLLECTIONS_MANAGER:[['Dashboard','/dashboard']],COMPLIANCE_RISK:[['Audit Trail','/audit'],['Compliance review queue','/compliance-review']]};
const chip=(t,c,i)=>`<span class="chip ${c}">${i?`<span aria-hidden="true">${i}</span>`:''}${esc(t)}</span>`;
const bandChip=b=>({HIGH:chip('HIGH priority','danger','▲'),MEDIUM:chip('MEDIUM priority','warn','◆'),LOW:chip('LOW priority','ok','▼')}[b]);
const TAGS={rules:['▦','Rules engine'],ai:['✦','AI-generated'],sim:['◇','Simulated'],rec:['▤','System record']};
const tag=k=>`<span class="tag ${k}"><span aria-hidden="true">${TAGS[k][0]}</span>${TAGS[k][1]}</span>`;
const banner=(k,html,icon,role)=>`<div class="banner ${k}" ${role===false?'':`role="${role||(k==='danger'?'alert':'status')}"`}><span class="bi" aria-hidden="true">${icon||({warn:'⚠',danger:'✖',info:'ℹ',ok:'✔',ai:'✦'}[k])}</span><div>${html}</div></div>`;
const errBox=(status,code,reason,msg,extra)=>banner('danger',`<strong>${status} ${esc(code)}${reason?' / '+esc(reason):''}</strong><br>${esc(msg)}${extra?'<br>'+extra:''}<br><span class="small muted">correlation_id: <code>c0ffee1234abcd</code></span>`);
function announce(msg){const l=$('#sr-live');l.textContent='';setTimeout(()=>{l.textContent=msg},40)}
let _tt;function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(_tt);_tt=setTimeout(()=>{t.hidden=true},3200);announce(msg)}
function setShell(persona,current,opts={}){
  const layout=persona==='CUSTOMER'?'Customer':'Internal';
  const nav=(NAV[persona]||[]).filter(n=>!n[2]||opts.demoFlag);
  $('#appbar').innerHTML=`<div class="brand"><span aria-hidden="true">◈</span> CollectAI <span class="env">${layout} layout</span></div>
  <nav aria-label="Main navigation">${nav.map(n=>`<a href="${n[1]}" data-route="${n[1]}" ${n[0]===current?'aria-current="page"':''}>${n[0]}</a>`).join('')}</nav>
  <div class="who"><span class="chip demo">Demo persona - not real authentication</span><span id="persona-chip" role="status" aria-live="polite">Current persona: <strong>${PN[persona]}</strong> <code>${persona}</code></span></div>`;
}
document.addEventListener('click',e=>{const a=e.target.closest('a[data-route]');if(a){e.preventDefault();if(window.onRoute)window.onRoute(a.dataset.route,a.textContent);else toast('Mockup: would navigate to '+a.dataset.route)}});
const forbiddenPage=(persona,route)=>`<section class="forbidden" role="alert" aria-labelledby="fh"><h1 id="fh"><span aria-hidden="true">⛔</span> 403 - Forbidden</h1><p>The persona <strong>${esc(persona)}</strong> cannot open <code>${esc(route)}</code>.</p><p class="muted">No restricted data was requested or rendered. The API would answer <code>403 FORBIDDEN</code> and write an <code>ACCESS_DENIED</code> audit event.</p>${api('403 FORBIDDEN (no data fetched)')}</section>`;
function openDialog({title,body,trigger,restore,focusSel,onMount}){
  const prev=trigger||document.activeElement;
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t" tabindex="-1"><h2 id="dlg-t">${title}</h2><div>${body}</div></div>`;
  document.body.appendChild(ov);const dlg=ov.firstElementChild;
  const bg=$$('[data-bg]');bg.forEach(e=>{e.inert=true;e.setAttribute('aria-hidden','true')});
  const foc=()=>$$('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])',dlg).filter(e=>!e.hidden);
  function close(){document.removeEventListener('keydown',key,true);ov.remove();bg.forEach(e=>{e.inert=false;e.removeAttribute('aria-hidden')});
    const t=document.contains(prev)?prev:(restore?$(restore):null);if(t&&t.focus)t.focus()}
  function key(e){
    if(e.key==='Escape'){e.stopPropagation();close();return}
    if(e.key==='Tab'){const f=foc();if(!f.length){e.preventDefault();return}const a=document.activeElement;
      if(e.shiftKey&&(a===f[0]||!dlg.contains(a))){e.preventDefault();f[f.length-1].focus()}
      else if(!e.shiftKey&&(a===f[f.length-1]||!dlg.contains(a))){e.preventDefault();f[0].focus()}}}
  document.addEventListener('keydown',key,true);
  if(onMount)onMount(dlg,close);
  const fi=(focusSel&&$(focusSel,dlg))||foc()[0]||dlg;fi.focus();
  return close;
}
function initMockbar(){
  const t=$('#theme-btn');t.addEventListener('click',()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark';t.textContent='Theme: '+(dark?'light':'dark')+' (toggle)'});
}

/* ---- page script: E3-S4 ---- */
/* E3-S4 Persona switcher. Shapes: SessionOptionsResponse, SessionCreateRequest, SessionInfo (api-contracts.md 3.2, section 4). */
const OPTIONS={
 personas:[
  {persona:'CUSTOMER',display_name:'Customer',description:'Chat with the AI collections assistant about one seeded account.',requires_customer_binding:true},
  {persona:'COLLECTIONS_OFFICER',display_name:'Collections Officer',description:'Work the portfolio, Customer 360, escalation queues and demo controls.',requires_customer_binding:false},
  {persona:'COLLECTIONS_MANAGER',display_name:'Collections Manager',description:'Read-only performance dashboard.',requires_customer_binding:false},
  {persona:'COMPLIANCE_RISK',display_name:'Compliance and Risk',description:'Audit trail and compliance review queue.',requires_customer_binding:false}],
 demo_customers:[
  {customer_id:'cus_0041',display_name:'Priya Raman',account_count:1},{customer_id:'cus_0052',display_name:'Marcus Feldman',account_count:2},
  {customer_id:'cus_0067',display_name:'Elena Vasquez',account_count:1},{customer_id:'cus_0073',display_name:'Tobias Lindqvist',account_count:1},
  {customer_id:'cus_0081',display_name:'Amara Nwosu',account_count:3},{customer_id:'cus_0094',display_name:'Sofia Marchetti',account_count:1}]};
const CAPS={
 CUSTOMER:['chat:use','self:read','self:write','session:read'],
 COLLECTIONS_OFFICER:['conversation:read','customer360:read','demo_controls:use','dispute:read','dispute:resolve','escalation:read','escalation:review','hardship:read','portfolio:read','ptp:read','ptp:record','recommendation:decide','recommendation:generate','recommendation:read','session:read','snapshot:refresh'],
 COLLECTIONS_MANAGER:['kpi:read','session:read'],
 COMPLIANCE_RISK:['audit:read','compliance:decide','escalation:read','session:read']};
const ROUTES=[['/chat','Chat','chat:use'],['/portfolio','Portfolio','portfolio:read'],['/customers/acc_000123','Customer 360','customer360:read'],['/escalations','Escalation list','escalation:review'],['/review-queues','Review queues','escalation:review'],['/demo-controls','Demo controls (flag)','demo_controls:use'],['/dashboard','Dashboard','kpi:read'],['/audit','Audit Trail','audit:read'],['/compliance-review','Compliance review queue','compliance:decide']];
let session={persona:'COLLECTIONS_OFFICER',customer_id:null,display_name:'Collections Officer',issued_at:'2026-10-01T14:30:00Z'};
let routeView=null,formErr=null,pendingPersona=null;
function resetState(){session={persona:'COLLECTIONS_OFFICER',customer_id:null,display_name:'Collections Officer',issued_at:'2026-10-01T14:30:00Z'};routeView=null;formErr=null;pendingPersona=null}
function sessionInfo(){return {persona:session.persona,customer_id:session.customer_id,display_name:session.display_name,capabilities:CAPS[session.persona],demo_label:'Demo persona - not real authentication',...(session.token?{session_token:session.token}:{}),issued_at:session.issued_at}}
function render(){
  const st=$('#mock-state').value;
  const head=`<div class="pagehead"><div><h1>Persona switcher</h1><p class="muted">Demo-only. Choosing a persona changes the header sent on later API calls. It is not authentication.</p></div><div>${api('GET /api/session/options')} ${api('GET /api/session/me')}</div></div>`;
  if(st==='error'){
    $('#appbar').innerHTML=`<div class="brand"><span aria-hidden="true">◈</span> CollectAI <span class="env">Internal layout</span></div><nav aria-label="Main navigation"></nav><div class="who"><span class="chip demo">Demo persona - not real authentication</span><span id="persona-chip" role="status">Current persona: <strong>none selected</strong></span></div>`;
    $('#main').innerHTML=head+errBox(503,'SERVICE_UNAVAILABLE',null,'Persona options could not be loaded. No persona is active and no navigation is shown.','<button type="button" class="btn secondary" id="retry">Retry</button> '+api('GET /api/session/options'));$('#retry').onclick=()=>toast('Mockup: retry would call GET /api/session/options');return}
  setShell(session.persona,routeView&&routeView.allowed?routeView.label:'',{demoFlag:true});
  const noCust=st==='nocustomers';const custs=noCust?[]:OPTIONS.demo_customers;
  const sel=pendingPersona||session.persona;
  const persona=OPTIONS.personas.map(p=>{const dis=p.requires_customer_binding&&noCust;return `<label style="display:flex;gap:8px;align-items:flex-start;padding:8px;border:1px solid var(--line);border-radius:8px;${dis?'opacity:.6':''}"><input type="radio" name="persona" value="${p.persona}" ${sel===p.persona?'checked':''} ${dis?'disabled':''} style="margin-top:4px"><span><strong>${esc(p.display_name)}</strong> <code>${p.persona}</code><br><span class="small muted">${esc(p.description)}${p.requires_customer_binding?' Requires choosing one seeded demo customer.':''}${dis?' Unavailable: no seeded demo customers.':''}</span></span></label>`}).join('');
  const custBlock=sel==='CUSTOMER'?`<label class="f" style="margin-top:10px">Demo customer (bound server-side as customer_id)<select id="cust" name="customer_id" aria-required="true" aria-describedby="custhelp"><option value="">Choose a demo customer...</option>${custs.map(c=>`<option value="${c.customer_id}" ${session.customer_id===c.customer_id?'selected':''}>${esc(c.display_name)} - ${c.account_count} account${c.account_count>1?'s':''}</option>`).join('')}</select><span id="custhelp" class="small muted">The server stores the binding in the demo session. The browser never sends a customer id on later calls.</span></label>`:'';
  const errHtml=formErr?errBox(422,'VALIDATION_ERROR','CUSTOMER_ID_REQUIRED_OR_FORBIDDEN','Choose one seeded demo customer before continuing as CUSTOMER.'):'';
  const info=sessionInfo();
  const routes=ROUTES.map(r=>`<li><button type="button" class="btn secondary" data-goto="${r[0]}" style="width:100%;text-align:left"><code>${r[0]}</code> ${r[1]}<br><span class="small muted">needs ${r[2]}</span></button></li>`).join('');
  let viewport='<p class="muted">Pick a route to simulate typing the URL directly. A route the persona cannot use shows the forbidden page and renders no data.</p>';
  if(routeView)viewport=routeView.allowed?banner('ok',`<strong>${esc(routeView.label)}</strong> is permitted for ${session.persona}. The real screen would render here (data fetched with header <code>X-Persona: ${session.persona}</code>).`):forbiddenPage(session.persona,routeView.route);
  $('#main').innerHTML=head+`<div class="grid g2" style="align-items:start">
   <div class="grid">
    <form class="panel" id="sw" novalidate><div class="ph"><h2>Switch persona</h2><span class="chip demo">Demo only</span></div>${errHtml}
     <fieldset><legend>Persona (exactly four)</legend><div class="grid" style="gap:8px">${persona}</div></fieldset>${custBlock}
     <div class="row" style="margin-top:12px"><button type="submit" class="btn">Use this persona</button>${api('POST /api/session')}</div>
     <p class="small muted">Request body preview: <code>${esc(JSON.stringify(sel==='CUSTOMER'?{persona:sel,customer_id:(session.customer_id||'cus_...')}:{persona:sel}))}</code></p></form>
    <section class="panel rules" aria-labelledby="rt"><div class="ph"><h2 id="rt">Open a route directly</h2><span class="tag rules"><span aria-hidden="true">▦</span>Rules engine</span></div><ul class="plain grid" style="gap:6px">${routes}</ul></section>
   </div>
   <div class="grid">
    <section class="panel" aria-labelledby="sm"><div class="ph"><h2 id="sm">Current session</h2>${api('GET /api/session/me')}</div>
     <dl class="kv"><dt>persona</dt><dd>${info.persona}</dd><dt>display_name</dt><dd>${esc(info.display_name)}</dd><dt>customer_id</dt><dd>${info.customer_id||'null'}</dd><dt>demo_label</dt><dd>${info.demo_label}</dd>${info.session_token?`<dt>session_token</dt><dd><code>5b0c...e1</code> <span class="small muted">opaque, sent as X-Demo-Session</span></dd>`:''}<dt>issued_at</dt><dd>${fmtDT(info.issued_at)}</dd><dt>capabilities</dt><dd>${info.capabilities.map(c=>`<code class="chip neutral" style="margin:2px">${c}</code>`).join(' ')}</dd></dl>
     <p class="small muted">Navigation above is derived only from <code>capabilities</code>. The API still enforces every capability on every request.</p></section>
    <section class="panel" aria-labelledby="vp" aria-live="polite"><div class="ph"><h2 id="vp">Route viewport</h2></div>${viewport}</section>
   </div></div>`;
  wire(custs);
}
function wire(custs){
  const f=$('#sw');
  $$('input[name=persona]',f).forEach(r=>r.addEventListener('change',()=>{pendingPersona=r.value;formErr=null;render();const n=$(`input[name=persona][value=${r.value}]`);if(n)n.focus()}));
  f.addEventListener('submit',e=>{e.preventDefault();const p=$('input[name=persona]:checked',f);if(!p)return;const cid=p.value==='CUSTOMER'?$('#cust').value:null;
    if(p.value==='CUSTOMER'&&!cid){formErr=true;pendingPersona='CUSTOMER';render();const c=$('#cust');if(c)c.focus();return}
    formErr=null;const opt=OPTIONS.personas.find(o=>o.persona===p.value);const cu=custs.find(c=>c.customer_id===cid);
    session={persona:p.value,customer_id:cid,display_name:cu?cu.display_name:opt.display_name,issued_at:'2026-10-01T14:31:07Z',token:cid?'5b0c...e1':null};pendingPersona=null;routeView=null;render();
    announce('Current persona: '+PN[session.persona]+(cu?', bound to '+cu.display_name:''));const rb=$('#sw button[type=submit]');if(rb)rb.focus()});
  $$('button[data-goto]').forEach(b=>b.onclick=()=>{const r=ROUTES.find(x=>x[0]===b.dataset.goto);routeView={route:r[0],label:r[1].replace(' (flag)',''),allowed:CAPS[session.persona].includes(r[2])};render();const nb=$(`button[data-goto="${r[0]}"]`);if(nb)nb.focus();announce(routeView.allowed?r[1]+' opened':'Forbidden: '+PN[session.persona]+' cannot open '+r[0])});
}
window.onRoute=(route,label)=>{const r=ROUTES.find(x=>x[0]===route);if(r){routeView={route:r[0],label:r[1].replace(' (flag)',''),allowed:CAPS[session.persona].includes(r[2])};render()}};

initMockbar();
$('#mock-state').addEventListener('change',()=>{if(typeof resetState==='function')resetState();render()});
render();
</script>
</body>
</html>
