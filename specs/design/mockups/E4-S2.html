<!DOCTYPE html>

<title>E4-S2 Customer 360 - CollectAI mockup</title>
<!--
  Mockup for story E4-S2: Customer 360
  Self-contained: inline CSS and vanilla JS only, no CDN, no web fonts, no network calls.
  Synthetic data only (fictional names, example.com, +1-555-01xx). Payments are simulated.
  Field names, enums and shapes follow specs/design/api-contracts.md (snake_case, money as 2dp strings).
  Contract gaps noted while building this mockup:
  - PtpValidateRequest has no record_version or snapshot_as_of (unlike PtpCreateRequest), so a dry run cannot report STALE_DATA.
  - PtpCreateRequest.snapshot_as_of is a required timestamp but SnapshotInfo.as_of can be null (freshness UNKNOWN); the contract does not say what to send.
  - POST /api/customers/{account_id}/refresh returns only SnapshotInfo, so the screen must re-read GET /api/customers/{account_id}/360 to refresh figures.
  - PtpValidationResult.alternatives is an untyped object (valid_amount_range, valid_date_range are documented in prose only).
  - No documented API field for the cancel or amend of a pending PTP from Customer 360 UI (POST /api/ptps/{ptp_id}/cancel exists but is not in the E4-S2 story API list); not mocked.
-->
<style>

:root[data-theme=dark]{--bg:#0d1620;--surface:#15212d;--surface2:#1d2c3b;--text:#e8eef4;--muted:#a9b7c4;--line:#34475b;--brand:#62b6ea;--brand-ink:#05131d;--ai:#c8b5ff;--ai-bg:#251b40;--rule:#8ccbf0;--rule-bg:#12293a;--warn:#ffd27a;--warn-bg:#3a2a08;--danger:#ffa19b;--danger-bg:#3d1614;--ok:#84e0a4;--ok-bg:#0f2e1d;--sim:#ffd08a;--sim-bg:#3b2907;--focus:#8ab8ff;--shadow:none;color-scheme:dark}

h1{font-size:1.45rem;margin:.2rem 0 .6rem;line-height:1.25}h2{font-size:1.1rem;margin:0 0 .5rem}h3{font-size:.98rem;margin:.8rem 0 .3rem}
p{margin:.3rem 0 .6rem}a{color:var(--brand)}
code,.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;font-size:.86em}

.tag.rules{color:var(--rule);background:var(--rule-bg)}.tag.ai{color:var(--ai);background:var(--ai-bg)}.tag.sim{color:var(--sim);background:var(--sim-bg)}.tag.rec{color:var(--muted);background:var(--surface2)}

.banner>div{flex:1;min-width:200px;color:var(--text)}.banner .bi{font-weight:800}
.btn{font:inherit;font-weight:600;border-radius:7px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);padding:7px 13px;cursor:pointer;min-height:36px}
.btn.secondary{background:var(--surface);color:var(--brand)}.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .btn.danger{color:#1b0605}}:root[data-theme=dark] .btn.danger{color:#1b0605}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}

label.f{display:flex;flex-direction:column;gap:3px;font-weight:600;font-size:.85rem;min-width:0}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--muted);border-radius:6px;padding:6px 8px;min-height:36px;max-width:100%}
textarea{width:100%;min-height:76px}
fieldset{border:1px solid var(--line);border-radius:8px;margin:0;padding:8px 10px}legend{font-weight:700;font-size:.85rem;padding:0 4px}
.checks{display:flex;flex-wrap:wrap;gap:4px 14px}.checks label{display:flex;gap:5px;align-items:center;font-weight:500}
.tablewrap{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}

td.num,th.num{text-align:right}

tr.clickable{cursor:pointer}tr.clickable:hover td{background:var(--surface2)}

dl.kv{display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:4px 14px;margin:0}dl.kv dt{color:var(--muted);font-size:.83rem}dl.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.stat{display:flex;flex-direction:column;gap:2px}.stat .v{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}.stat .l{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.overlay{position:fixed;inset:0;background:rgba(5,12,20,.6);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}

.dialog:focus{outline:none}.dlg-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:12px}

.toast[hidden]{display:none}

.bar{display:inline-block;height:8px;background:var(--rule);border-radius:4px;vertical-align:middle;min-width:2px}
ul.plain{list-style:none;padding:0;margin:0}

@media (max-width:600px){main{padding:10px}.appbar{padding:8px 10px}.mockbar{padding:6px 10px}}

.jump{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.85rem;margin:6px 0 12px}
.tight th,.tight td{padding:6px 8px}
section[tabindex="-1"]:focus{outline:3px solid var(--focus);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpis .panel{padding:10px}

</style>

<body>
<a class="skip" href="#main">Skip to main content</a>
<div class="mockbar" data-bg>
  <strong>Mockup E4-S2</strong><span class="muted">controls below are not part of the product UI</span>
  <label>State: <select id="mock-state" aria-label="Mockup state toggle">
<option value="happy">Happy path: fresh, AI recommendation</option>
<option value="ai_down">AI provider unavailable</option>
<option value="stale">Snapshot STALE (refresh banner)</option>
<option value="escalated">Escalated + hardship + dispute</option>
<option value="policy">Error: POLICY_UNAVAILABLE</option>
<option value="notfound">Error: 404 NOT_FOUND</option>
  </select></label>
  <button type="button" class="btn secondary" id="theme-btn" style="min-height:28px;padding:2px 10px">Theme: toggle light/dark</button>
</div>
<div id="root" data-bg>
  <header class="appbar" id="appbar"></header>
  <main id="main" tabindex="-1"></main>
</div>
<div id="sr-live" class="sr" aria-live="polite" aria-atomic="true"></div>
<div id="toast" class="toast" role="status" hidden></div>
<script>
/* ---- shared mockup helpers (inlined per file; no external deps) ---- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=l=>`<span class="api" data-api="${esc(l)}" title="API call">${esc(l)}</span>`;
const money=s=>{const m=String(s).match(/^(-?)(\d+)\.(\d{2})$/);return m?`${m[1]}AED ${m[2].replace(/\B(?=(\d{3})+(?!\d))/g,',')}.${m[3]}`:esc(s)};
const cents=s=>{const m=String(s).trim().match(/^(\d+)(?:\.(\d{1,2}))?$/);return m?BigInt(m[1])*100n+BigInt((m[2]||'').padEnd(2,'0')||'0'):null};
const fromCents=c=>{const n=c<0n?-c:c;const s=n.toString().padStart(3,'0');return (c<0n?'-':'')+s.slice(0,-2)+'.'+s.slice(-2)};
const pct4=v=>{if(v==null)return '-';const [i,f='']=String(v).split('.');const n=BigInt(i+f.padEnd(4,'0').slice(0,4));const s=n.toString().padStart(3,'0');return s.slice(0,-2)+'.'+s.slice(-2)+'%'};
const fmtDT=t=>{if(!t)return '-';const d=new Date(t),z=new Date(d.getTime()+14400000),p=n=>String(n).padStart(2,'0');return `${z.getUTCFullYear()}-${p(z.getUTCMonth()+1)}-${p(z.getUTCDate())} ${p(z.getUTCHours())}:${p(z.getUTCMinutes())} GST`};
const PN={CUSTOMER:'Customer',COLLECTIONS_OFFICER:'Collections Officer',COLLECTIONS_MANAGER:'Collections Manager',COMPLIANCE_RISK:'Compliance and Risk'};
const NAV={CUSTOMER:[['Chat','/chat']],COLLECTIONS_OFFICER:[['Portfolio','/portfolio'],['Customer 360','/customers/acc_000123'],['Escalations','/escalations'],['Review queues','/review-queues'],['Demo controls','/demo-controls',true]],COLLECTIONS_MANAGER:[['Dashboard','/dashboard']],COMPLIANCE_RISK:[['Audit Trail','/audit'],['Compliance review queue','/compliance-review']]};
const chip=(t,c,i)=>`<span class="chip ${c}">${i?`<span aria-hidden="true">${i}</span>`:''}${esc(t)}</span>`;
const bandChip=b=>({HIGH:chip('HIGH priority','danger','▲'),MEDIUM:chip('MEDIUM priority','warn','◆'),LOW:chip('LOW priority','ok','▼')}[b]);
const TAGS={rules:['▦','Rules engine'],ai:['✦','AI-generated'],sim:['◇','Simulated'],rec:['▤','System record']};
const tag=k=>`<span class="tag ${k}"><span aria-hidden="true">${TAGS[k][0]}</span>${TAGS[k][1]}</span>`;
const banner=(k,html,icon,role)=>`<div class="banner ${k}" ${role===false?'':`role="${role||(k==='danger'?'alert':'status')}"`}><span class="bi" aria-hidden="true">${icon||({warn:'⚠',danger:'✖',info:'ℹ',ok:'✔',ai:'✦'}[k])}</span><div>${html}</div></div>`;
const errBox=(status,code,reason,msg,extra)=>banner('danger',`<strong>${status} ${esc(code)}${reason?' / '+esc(reason):''}</strong><br>${esc(msg)}${extra?'<br>'+extra:''}<br><span class="small muted">correlation_id: <code>c0ffee1234abcd</code></span>`);
function announce(msg){const l=$('#sr-live');l.textContent='';setTimeout(()=>{l.textContent=msg},40)}
let _tt;function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(_tt);_tt=setTimeout(()=>{t.hidden=true},3200);announce(msg)}
function setShell(persona,current,opts={}){
  const layout=persona==='CUSTOMER'?'Customer':'Internal';
  const nav=(NAV[persona]||[]).filter(n=>!n[2]||opts.demoFlag);
  $('#appbar').innerHTML=`<div class="brand"><span aria-hidden="true">◈</span> CollectAI <span class="env">${layout} layout</span></div>
  <nav aria-label="Main navigation">${nav.map(n=>`<a href="${n[1]}" data-route="${n[1]}" ${n[0]===current?'aria-current="page"':''}>${n[0]}</a>`).join('')}</nav>
  <div class="who"><span class="chip demo">Demo persona - not real authentication</span><span id="persona-chip" role="status" aria-live="polite">Current persona: <strong>${PN[persona]}</strong> <code>${persona}</code></span></div>`;
}
document.addEventListener('click',e=>{const a=e.target.closest('a[data-route]');if(a){e.preventDefault();if(window.onRoute)window.onRoute(a.dataset.route,a.textContent);else toast('Mockup: would navigate to '+a.dataset.route)}});
const forbiddenPage=(persona,route)=>`<section class="forbidden" role="alert" aria-labelledby="fh"><h1 id="fh"><span aria-hidden="true">⛔</span> 403 - Forbidden</h1><p>The persona <strong>${esc(persona)}</strong> cannot open <code>${esc(route)}</code>.</p><p class="muted">No restricted data was requested or rendered. The API would answer <code>403 FORBIDDEN</code> and write an <code>ACCESS_DENIED</code> audit event.</p>${api('403 FORBIDDEN (no data fetched)')}</section>`;
function openDialog({title,body,trigger,restore,focusSel,onMount}){
  const prev=trigger||document.activeElement;
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t" tabindex="-1"><h2 id="dlg-t">${title}</h2><div>${body}</div></div>`;
  document.body.appendChild(ov);const dlg=ov.firstElementChild;
  const bg=$$('[data-bg]');bg.forEach(e=>{e.inert=true;e.setAttribute('aria-hidden','true')});
  const foc=()=>$$('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])',dlg).filter(e=>!e.hidden);
  function close(){document.removeEventListener('keydown',key,true);ov.remove();bg.forEach(e=>{e.inert=false;e.removeAttribute('aria-hidden')});
    const t=document.contains(prev)?prev:(restore?$(restore):null);if(t&&t.focus)t.focus()}
  function key(e){
    if(e.key==='Escape'){e.stopPropagation();close();return}
    if(e.key==='Tab'){const f=foc();if(!f.length){e.preventDefault();return}const a=document.activeElement;
      if(e.shiftKey&&(a===f[0]||!dlg.contains(a))){e.preventDefault();f[f.length-1].focus()}
      else if(!e.shiftKey&&(a===f[f.length-1]||!dlg.contains(a))){e.preventDefault();f[0].focus()}}}
  document.addEventListener('keydown',key,true);
  if(onMount)onMount(dlg,close);
  const fi=(focusSel&&$(focusSel,dlg))||foc()[0]||dlg;fi.focus();
  return close;
}
function initMockbar(){
  const t=$('#theme-btn');t.addEventListener('click',()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark';t.textContent='Theme: '+(dark?'light':'dark')+' (toggle)'});
}

/* ---- page script: E4-S2 ---- */
/* E4-S2 Customer 360. Shape: Customer360 (api-contracts.md 3.4 and section 4). Clock now = 2026-10-01T14:30:00Z. */

const CLOCK_NOW='2026-10-01T14:30:00Z',TODAY='2026-10-01',WINDOW_LAST='2026-10-31';
const ACT={CONTACT_CUSTOMER:'Contact customer',REQUEST_PAYMENT:'Request payment',OFFER_ELIGIBLE_ARRANGEMENT:'Offer eligible arrangement',FOLLOW_UP_PTP:'Follow up on promise to pay',REFER_TO_HARDSHIP_WORKFLOW:'Refer to hardship workflow',ESCALATE_TO_HUMAN_REVIEW:'Escalate to human review'};
const BUCKET_L={CURRENT:'Current',DPD_1_29:'1-29 DPD',DPD_30_59:'30-59 DPD',DPD_60_89:'60-89 DPD',DPD_90_PLUS:'90+ DPD'};
const REASON_MSG={ZERO_AMOUNT:'Amount must be greater than 0.00.',NEGATIVE_AMOUNT:'Amount cannot be negative.',OVER_PRECISION:'At most 2 decimal places are allowed.',BELOW_MIN_AMOUNT:'Amount is below the minimum of 20.00.',OVER_BALANCE:'Amount is more than the undisputed overdue amount.',PAST_DATE:'Date is in the past.',OUTSIDE_WINDOW:'Date is outside the permitted window.',CONFLICTING_ACTIVE_ITEM:'An active PENDING promise already exists. Cancel or amend it first.',DISPUTED_ITEM:'The promise touches an item under active dispute.',FIELD_INVALID:'Enter a decimal amount and a YYYY-MM-DD date.'};

   <dl class="kv small"><dt>content_source</dt><dd>${r.content_source}</dd><dt>model_id</dt><dd>${r.model_id||'null (template)'}</dd><dt>prompt_version</dt><dd>${r.prompt_version||'null'}</dd><dt>policy_version</dt><dd>${r.policy_version}</dd><dt>record_version</dt><dd>${r.record_version}</dd><dt>created_at</dt><dd>${fmtDT(r.created_at)}</dd><dt>audit_event_id</dt><dd>${r.audit_event_id}</dd></dl>
   ${C.ai.status==='HUMAN_REVIEW_ONLY'?banner('info','Forced by the rules engine: human treatment applies, so the model output is ignored.',null,false):''}
   ${r.officer_decision?`<p>${chip('Officer decision: '+r.officer_decision,'ok','✔')} <span class="small muted">The AI only recommends; a human decides.</span></p>`:`<div class="row"><button type="button" class="btn" id="accept">Accept recommendation</button><button type="button" class="btn secondary" id="override">Override...</button></div><p class="small muted" style="margin:4px 0 0">${api('POST .../recommendation/'+r.recommendation_id+'/decision')} Idempotency-Key required. Override needs a reason.</p>`}
   <div class="row" style="margin-top:8px"><button type="button" class="btn link" id="gen">Regenerate</button>${api('POST /api/accounts/'+a.account_id+'/recommendation')}</div>`}
  const ai=panel('ai','Next-best-action','ai',aiBody,'',api('GET /api/accounts/{id}/recommendation'));
  let caseB=esc_.has_open_case?banner('danger',`<strong>${esc(esc_.badge)}</strong> Automated treatment is paused until a human decides.`,'⚑'):'<p>'+chip('No open escalation','ok','✔')+'</p>';
  caseB+=esc_.cases.map(cs=>`<p class="small"><span class="mono">${cs.case_id}</span> &middot; ${cs.reason} &middot; ${chip(cs.status,'warn')} ${chip(cs.priority,'danger')} &middot; queue ${cs.queue} &middot; ${fmtDT(cs.created_at)}</p>`).join('');
  caseB+=`<h3>Hardship</h3>`+(C.hardship_cases.length?C.hardship_cases.map(h=>`<p>${chip('Hardship '+h.status,'warn','⚠')} <span class="mono small">${h.hardship_case_id}</span></p><ul>${h.indicators.map(i=>`<li><strong>${i.indicator_type}</strong>: <span class="muted">"${esc(i.customer_statement)}"</span></li>`).join('')}</ul>`).join(''):'<p class="muted">No hardship indicators.</p>');
  caseB+=`<h3>Disputes</h3>`+(C.disputes.length?C.disputes.map(x=>`<p>${chip('Dispute '+x.status,'danger','⚑')} <span class="mono small">${x.dispute_id}</span><br>${x.category} on item <span class="mono small">${x.item_id||'whole overdue amount'}</span><br><span class="muted">"${esc(x.customer_reason)}"</span></p>`).join(''):'<p class="muted">No disputes.</p>');
  const cases=panel('case','Escalation, hardship and dispute','rec',caseB,'',api('GET .../360'));
  const tr=d.treatment,cp=d.contact_policy;
  const treat=panel('treat','Treatment, contact policy and payable amounts','rules',`<dl class="kv"><dt>human_treatment</dt><dd>${tr.human_treatment?chip('Yes','info','☺'):'No'}</dd><dt>automated suppressed</dt><dd>${tr.automated_treatment_suppressed?chip('Suppressed','warn','⚠'):'No'}</dd><dt>suppressions</dt><dd>${tr.suppressions.length?tr.suppressions.map(x=>`<span class="chip neutral" style="margin:2px">${x.source_type} / ${x.scope}</span>`).join(' '):'none'}</dd><dt>contact policy</dt><dd>${cp?(cp.contact_allowed?chip('Contact allowed','ok','✔'):chip('Blocked '+cp.reason_code,'danger','✖'))+' <span class="small muted">'+cp.attempts_in_period+' attempts in period</span>':'n/a'}</dd><dt>payable options</dt><dd>${d.payable_options.length?d.payable_options.map(o=>`${o.option}: ${money(o.amount)}`).join('<br>'):'none (suppressed or unavailable)'}</dd></dl><p class="small muted">System-calculated. The AI may never change these values.</p>`,'',api('GET .../360'));
  html+=`<div class="cols"><div>${snap}${acct}${prio}${ptpP}${pay}${inter}</div><div>${ai}${cases}${treat}</div></div><p class="footnote">Legend: ${tag('rules')} deterministic data from the rules engine &middot; ${tag('ai')} model-generated, advisory only &middot; ${tag('rec')} stored system record &middot; ${tag('sim')} simulated payment data.</p>`;
  $('#main').innerHTML=html;wire();
}
function keep(id){const e=$(id);if(e)e.focus()}
function wire(){
  $$('a[data-jump]').forEach(a=>a.onclick=e=>{e.preventDefault();const t=$('#'+a.dataset.jump);if(t){t.scrollIntoView({block:'start'});t.focus()}});
  const refresh=()=>{C.snapshot={as_of:CLOCK_NOW,record_version:C.snapshot.record_version+1,freshness:'FRESH',freshness_reason_code:null,max_age_minutes:240};UI.result='';render();announce('Snapshot refreshed. record_version is now '+C.snapshot.record_version+'. Pending customer proposals for this account are invalidated.');keep('#refresh-a')};
  ['#refresh-a','#refresh-b'].forEach(i=>{const b=$(i);if(b)b.onclick=refresh});
  const gen=$('#gen');if(gen)gen.onclick=()=>{if(C.ai.status==='AI_UNAVAILABLE'){toast('AI still unavailable (200 AI_UNAVAILABLE). Nothing fabricated.')}else{C.ai.recommendation.created_at=CLOCK_NOW;C.ai.recommendation.officer_decision=null;render();announce('Recommendation regenerated');keep('#gen')}};
  const acc=$('#accept');if(acc)acc.onclick=()=>{C.ai.recommendation.officer_decision='ACCEPTED';render();announce('Recommendation accepted by officer');keep('#gen')};
  const ov=$('#override');if(ov)ov.onclick=()=>{
    openDialog({title:'Override AI recommendation',trigger:ov,restore:'#override,#gen',focusSel:'#o-reason',body:`<p class="small muted">Your reason is recorded in the audit trail and counts toward the human override rate. ${api('POST .../recommendation/'+C.ai.recommendation.recommendation_id+'/decision')} <span class="mono small">decision: OVERRIDDEN</span></p>
     <label class="f">chosen_action (your action)<select id="o-act">${Object.keys(ACT).filter(k=>k!==C.ai.recommendation.action).map(k=>`<option value="${k}">${ACT[k]}</option>`).join('')}</select></label>
     <label class="f" style="margin-top:8px">reason (required, 1-1000 characters)<textarea id="o-reason" aria-required="true" aria-describedby="o-err"></textarea></label><p id="o-err" class="small" style="color:var(--danger)" role="alert"></p>
     <div class="dlg-actions"><button type="button" class="btn secondary" id="o-cancel">Cancel</button><button type="button" class="btn" id="o-ok" disabled>Record override</button></div>`,
     onMount:(dlg,close)=>{const t=$('#o-reason',dlg),ok=$('#o-ok',dlg);t.addEventListener('input',()=>{ok.disabled=!t.value.trim();$('#o-err',dlg).textContent=t.value.trim()?'':'REASON_REQUIRED: a reason is mandatory.'});$('#o-cancel',dlg).onclick=close;ok.onclick=()=>{C.ai.recommendation.officer_decision='OVERRIDDEN';close();render();announce('Override recorded');keep('#gen')}}})};
  const f=$('#ptpf');
  const draft=()=>{UI.draft={amount:$('#f-amt').value,date:$('#f-date').value,ref:$('#f-ref').value}};
  const show=html=>{$('#ptpres').innerHTML=html};
  $('#f-validate').onclick=()=>{draft();UI.result='';
    if(C.deterministic.status==='POLICY_UNAVAILABLE'){UI.result=errBox(503,'POLICY_UNAVAILABLE',null,'No valid active PolicyRuleSet. Validation fails closed.');show(UI.result);return}
    const v=validatePtp(UI.draft.amount,UI.draft.date);
    UI.result=v.valid?banner('ok',`<strong>Valid (dry run).</strong> Nothing recorded. ${api('200 PtpValidationResult')} valid=true, policy_version ${v.policy_version}.`):banner('warn',`<strong>Not valid.</strong> ${v.reason_codes.map(c=>`<code>${c}</code> ${esc(REASON_MSG[c])}`).join('<br>')}<br><span class="small">Alternatives: amount ${money(v.alternatives.valid_amount_range.min)} to ${money(v.alternatives.valid_amount_range.max)}; date ${v.alternatives.valid_date_range.earliest} to ${v.alternatives.valid_date_range.latest}. ${api('200 PtpValidationResult')}</span>`);
    show(UI.result);announce(v.valid?'Validation passed':'Validation failed: '+v.reason_codes.join(', '))};
  f.addEventListener('submit',e=>{e.preventDefault();draft();
    if(C.deterministic.status==='POLICY_UNAVAILABLE'){UI.result=errBox(503,'POLICY_UNAVAILABLE',null,'No valid active PolicyRuleSet. Nothing recorded (fail closed).');show(UI.result);return}
    if(C.snapshot.freshness!=='FRESH'){UI.result=errBox(409,'CONFLICT','STALE_DATA','The snapshot is stale. Refresh it and review the figures before recording.','context.refreshed_context would be returned.');show(UI.result);announce('Recording blocked: stale data');return}
    const v=validatePtp(UI.draft.amount,UI.draft.date);
    if(!v.valid){const conflict=v.reason_codes.includes('CONFLICTING_ACTIVE_ITEM');UI.result=errBox(conflict?409:422,conflict?'CONFLICT':'BUSINESS_RULE_VIOLATION',v.reason_codes[0],REASON_MSG[v.reason_codes[0]],v.reason_codes.map(c=>`<code>${c}</code>`).join(' ')+(conflict?'<br>context.permitted_paths: cancel, amend':`<br>alternatives: ${money(v.alternatives.valid_amount_range.min)}-${money(v.alternatives.valid_amount_range.max)}, ${v.alternatives.valid_date_range.earliest} to ${v.alternatives.valid_date_range.latest}`));show(UI.result);announce('Not recorded: '+v.reason_codes[0]);return}
    const n=ptp('ptp_01J8ZK7'+String(UI.key).padStart(3,'0'),fromCents(cents(UI.draft.amount)),UI.draft.date,'PENDING','0.00','OFFICER_MANUAL',CLOCK_NOW);n.interaction_reference=UI.draft.ref||null;
    C.ptp_history.unshift(n);C.account.collection_status='PTP_PENDING';UI.key++;
    UI.result=banner('ok',`<strong>201 Created.</strong> ${n.ptp_id} recorded as PENDING (source OFFICER_MANUAL) for ${money(n.promised_amount)} due ${n.promised_date}. ${api('POST /api/ptps')}`);
    render();announce('Promise to pay recorded');keep('#f-amt')});
}

initMockbar();
$('#mock-state').addEventListener('change',()=>{if(typeof resetState==='function')resetState();render()});
render();
</script>
</body>
</html>
