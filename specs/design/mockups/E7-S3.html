<title>E7-S3 Escalation and Review Queue - CollectAI mockup</title>
<!--
  Mockup for story E7-S3: Escalation and Review Queue
  Self-contained: inline CSS and vanilla JS only, no CDN, no web fonts, no network calls.
  Synthetic data only (fictional names, example.com, +1-555-01xx). Payments are simulated.
  Field names, enums and shapes follow specs/design/api-contracts.md (snake_case, money as 2dp strings).
  Contract gaps noted while building this mockup:
  - AC3 (buttons disabled until a reason is entered) and AC7 (dialog focuses the reason field) overlap; the mockup gates the dialog submit button on the reason and lists REJECT, MODIFY, ESCALATE as normal buttons that open the dialog.
  - The contract does not say how a reviewer supplies the requested information when a case is AWAITING_INFORMATION (only start-review resumes it).
  - VERSION_CONFLICT returns context.current_version only, so the UI must re-GET /api/escalations/{case_id} to reload the case.
  - ComplianceOutcome values have no descriptions in the contract, so the compliance dialog shows raw enum names.
  - allowed_escalate_reasons (routing.reviewer_escalation_reasons) values are not enumerated; the mockup assumes HIGH_RISK_COMPLIANCE, POLICY_EXCEPTION, VULNERABLE_CUSTOMER.
-->
<style>

<div class="mockbar" data-bg>
  <strong>Mockup E7-S3</strong><span class="muted">controls below are not part of the product UI</span>
  <label>State: <select id="mock-state" aria-label="Mockup state toggle">
<option value="officer">Officer: queue and reviewer actions</option>
<option value="officer_empty">Officer: empty queue filter</option>

<script>
/* ---- shared mockup helpers (inlined per file; no external deps) ---- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=l=>`<span class="api" data-api="${esc(l)}" title="API call">${esc(l)}</span>`;
const money=s=>{const m=String(s).match(/^(-?)(\d+)\.(\d{2})$/);return m?`${m[1]}AED ${m[2].replace(/\B(?=(\d{3})+(?!\d))/g,',')}.${m[3]}`:esc(s)};
const cents=s=>{const m=String(s).trim().match(/^(\d+)(?:\.(\d{1,2}))?$/);return m?BigInt(m[1])*100n+BigInt((m[2]||'').padEnd(2,'0')||'0'):null};
const fromCents=c=>{const n=c<0n?-c:c;const s=n.toString().padStart(3,'0');return (c<0n?'-':'')+s.slice(0,-2)+'.'+s.slice(-2)};
const pct4=v=>{if(v==null)return '-';const [i,f='']=String(v).split('.');const n=BigInt(i+f.padEnd(4,'0').slice(0,4));const s=n.toString().padStart(3,'0');return s.slice(0,-2)+'.'+s.slice(-2)+'%'};
const fmtDT=t=>{if(!t)return '-';const d=new Date(t),z=new Date(d.getTime()+14400000),p=n=>String(n).padStart(2,'0');return `${z.getUTCFullYear()}-${p(z.getUTCMonth()+1)}-${p(z.getUTCDate())} ${p(z.getUTCHours())}:${p(z.getUTCMinutes())} GST`};
const PN={CUSTOMER:'Customer',COLLECTIONS_OFFICER:'Collections Officer',COLLECTIONS_MANAGER:'Collections Manager',COMPLIANCE_RISK:'Compliance and Risk'};
const NAV={CUSTOMER:[['Chat','/chat']],COLLECTIONS_OFFICER:[['Portfolio','/portfolio'],['Customer 360','/customers/acc_000123'],['Escalations','/escalations'],['Review queues','/review-queues'],['Demo controls','/demo-controls',true]],COLLECTIONS_MANAGER:[['Dashboard','/dashboard']],COMPLIANCE_RISK:[['Audit Trail','/audit'],['Compliance review queue','/compliance-review']]};
const chip=(t,c,i)=>`<span class="chip ${c}">${i?`<span aria-hidden="true">${i}</span>`:''}${esc(t)}</span>`;
const bandChip=b=>({HIGH:chip('HIGH priority','danger','▲'),MEDIUM:chip('MEDIUM priority','warn','◆'),LOW:chip('LOW priority','ok','▼')}[b]);
const TAGS={rules:['▦','Rules engine'],ai:['✦','AI-generated'],sim:['◇','Simulated'],rec:['▤','System record']};
const tag=k=>`<span class="tag ${k}"><span aria-hidden="true">${TAGS[k][0]}</span>${TAGS[k][1]}</span>`;
const banner=(k,html,icon,role)=>`<div class="banner ${k}" ${role===false?'':`role="${role||(k==='danger'?'alert':'status')}"`}><span class="bi" aria-hidden="true">${icon||({warn:'⚠',danger:'✖',info:'ℹ',ok:'✔',ai:'✦'}[k])}</span><div>${html}</div></div>`;
const errBox=(status,code,reason,msg,extra)=>banner('danger',`<strong>${status} ${esc(code)}${reason?' / '+esc(reason):''}</strong><br>${esc(msg)}${extra?'<br>'+extra:''}<br><span class="small muted">correlation_id: <code>c0ffee1234abcd</code></span>`);
function announce(msg){const l=$('#sr-live');l.textContent='';setTimeout(()=>{l.textContent=msg},40)}
let _tt;function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(_tt);_tt=setTimeout(()=>{t.hidden=true},3200);announce(msg)}
function setShell(persona,current,opts={}){
  const layout=persona==='CUSTOMER'?'Customer':'Internal';
  const nav=(NAV[persona]||[]).filter(n=>!n[2]||opts.demoFlag);
  $('#appbar').innerHTML=`<div class="brand"><span aria-hidden="true">◈</span> CollectAI <span class="env">${layout} layout</span></div>
  <nav aria-label="Main navigation">${nav.map(n=>`<a href="${n[1]}" data-route="${n[1]}" ${n[0]===current?'aria-current="page"':''}>${n[0]}</a>`).join('')}</nav>
  <div class="who"><span class="chip demo">Demo persona - not real authentication</span><span id="persona-chip" role="status" aria-live="polite">Current persona: <strong>${PN[persona]}</strong> <code>${persona}</code></span></div>`;
}
document.addEventListener('click',e=>{const a=e.target.closest('a[data-route]');if(a){e.preventDefault();if(window.onRoute)window.onRoute(a.dataset.route,a.textContent);else toast('Mockup: would navigate to '+a.dataset.route)}});
const forbiddenPage=(persona,route)=>`<section class="forbidden" role="alert" aria-labelledby="fh"><h1 id="fh"><span aria-hidden="true">⛔</span> 403 - Forbidden</h1><p>The persona <strong>${esc(persona)}</strong> cannot open <code>${esc(route)}</code>.</p><p class="muted">No restricted data was requested or rendered. The API would answer <code>403 FORBIDDEN</code> and write an <code>ACCESS_DENIED</code> audit event.</p>${api('403 FORBIDDEN (no data fetched)')}</section>`;
function openDialog({title,body,trigger,restore,focusSel,onMount}){
  const prev=trigger||document.activeElement;
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t" tabindex="-1"><h2 id="dlg-t">${title}</h2><div>${body}</div></div>`;
  document.body.appendChild(ov);const dlg=ov.firstElementChild;
  const bg=$$('[data-bg]');bg.forEach(e=>{e.inert=true;e.setAttribute('aria-hidden','true')});
  const foc=()=>$$('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])',dlg).filter(e=>!e.hidden);
  function close(){document.removeEventListener('keydown',key,true);ov.remove();bg.forEach(e=>{e.inert=false;e.removeAttribute('aria-hidden')});
    const t=document.contains(prev)?prev:(restore?$(restore):null);if(t&&t.focus)t.focus()}
  function key(e){
    if(e.key==='Escape'){e.stopPropagation();close();return}
    if(e.key==='Tab'){const f=foc();if(!f.length){e.preventDefault();return}const a=document.activeElement;
      if(e.shiftKey&&(a===f[0]||!dlg.contains(a))){e.preventDefault();f[f.length-1].focus()}
      else if(!e.shiftKey&&(a===f[f.length-1]||!dlg.contains(a))){e.preventDefault();f[0].focus()}}}
  document.addEventListener('keydown',key,true);
  if(onMount)onMount(dlg,close);
  const fi=(focusSel&&$(focusSel,dlg))||foc()[0]||dlg;fi.focus();
  return close;
}
function initMockbar(){
  const t=$('#theme-btn');t.addEventListener('click',()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark';t.textContent='Theme: '+(dark?'light':'dark')+' (toggle)'});

/* ---- page script: E7-S3 ---- */
/* E7-S3 Escalation and Review Queue. Shapes: EscalationPage, EscalationListItem, EscalationSummaryResponse, EscalationDetail, DecisionRequest, ComplianceDecisionRequest (api-contracts.md 3.9, section 4).
   Note on AC3: the action buttons open a reason dialog; the dialog's submit button stays disabled until a reason (and any required option) is entered. */

const ROLE_OF_QUEUE={COMPLIANCE_REVIEW:'COMPLIANCE_RISK'};
const QUEUES=['COLLECTIONS_REVIEW','COLLECTIONS_EXCEPTION_REVIEW','HARDSHIP_REVIEW','DISPUTE_REVIEW','VULNERABLE_CUSTOMER_REVIEW','COMPLIANCE_REVIEW'];

const ACTIVE=['OPEN','IN_REVIEW','AWAITING_INFORMATION'];
const PRI={URGENT:0,ELEVATED:1,NORMAL:2};
const ESC_REASONS=['HIGH_RISK_COMPLIANCE','POLICY_EXCEPTION','VULNERABLE_CUSTOMER'];
const ROUTE_Q={HIGH_RISK_COMPLIANCE:'COMPLIANCE_REVIEW',POLICY_EXCEPTION:'COLLECTIONS_EXCEPTION_REVIEW',VULNERABLE_CUSTOMER:'VULNERABLE_CUSTOMER_REVIEW'};
const mk=(n,reason,queue,pri,status,src,age,cust,cid,acc,ver)=>({case_id:'esc_01J8ZK9A'+n,reason,queue,reviewer_role:queue==='COMPLIANCE_REVIEW'?'COMPLIANCE_RISK':'COLLECTIONS_OFFICER',priority:pri,status,source:src,created_at:'2026-10-01T14:30:00Z',age_hours:age,aging_warning:age>=AGING[pri],customer_id:cid,customer_name:cust,account_id:acc,customer_360_path:'/customers/'+acc,version:ver,decisions:[]});

  let extra='';
  if(action==='MODIFY')extra=`<label class="f" style="margin-top:8px">Eligible option (option_id)<select id="a-opt"><option value="">Choose an option...</option>${el.options.map(o=>`<option value="${o.option_id}">${o.installment_count} x ${money(o.installment_amount)} (last ${money(o.final_installment_amount)}), first ${o.first_installment_date}</option>`).join('')}</select><span class="small muted">Only rules-engine options. Free-form amounts are rejected (FREE_FORM_AMOUNT_NOT_ALLOWED). The customer must confirm the modified terms.</span></label>`;
  if(action==='ESCALATE')extra=`<label class="f" style="margin-top:8px">escalate_reason (whitelisted)<select id="a-esc"><option value="">Choose a reason...</option>${d.allowed_escalate_reasons.map(r=>`<option value="${r}">${r}</option>`).join('')}</select><span class="small muted">You cannot pick a queue. The routing service chooses the destination.</span></label>`;
  if(comp)extra=`<fieldset style="margin-top:8px"><legend>Outcome (compliance.review_outcomes)</legend><div class="checks">${d.compliance_outcomes.map(o=>`<label><input type="radio" name="a-out" value="${o}">${o}</label>`).join('')}</div></fieldset>`;
  if(['FINANCIAL_HARDSHIP','VULNERABLE_CUSTOMER'].includes(c.reason)&&(action==='APPROVE'||action==='REJECT'))extra+=`<label class="checks" style="margin-top:8px"><input type="checkbox" id="a-rel"> release_suppression (release hardship or vulnerable suppression)</label>`;
  openDialog({title:lab+' - '+esc(c.customer_name),trigger,restore:`[data-action="${action}"]`,focusSel:'#a-reason',body:`<p class="small muted">${api(comp?'POST /api/escalations/'+c.case_id+'/compliance-decision':'POST /api/escalations/'+c.case_id+'/decisions')} <span class="mono small">action: ${action}, expected_version: ${c.version}</span></p>${extra}
   <label class="f" style="margin-top:8px">${isNote?'Note (required)':'Reason (required, 1-1000 characters)'}<textarea id="a-reason" aria-required="true" aria-describedby="a-msg"></textarea></label><p id="a-msg" class="small" style="color:var(--danger)" role="status"></p><div id="a-err" role="alert"></div>
   <div class="dlg-actions"><button type="button" class="btn secondary" id="a-cancel">Cancel</button><button type="button" class="btn ${action==='REJECT'?'danger':''}" id="a-ok" disabled>${lab}</button></div>`,
   onMount:(dlg,close)=>{
    const t=$('#a-reason',dlg),ok=$('#a-ok',dlg);
    const upd=()=>{const okText=!!t.value.trim();const okOpt=action!=='MODIFY'||$('#a-opt',dlg).value;const okEsc=action!=='ESCALATE'||$('#a-esc',dlg).value;const okOut=!comp||$('input[name=a-out]:checked',dlg);ok.disabled=!(okText&&okOpt&&okEsc&&okOut);$('#a-msg',dlg).textContent=okText?'':(isNote?'NOTE_REQUIRED':'REASON_REQUIRED')+': enter text to enable this action.'};
    dlg.addEventListener('input',upd);dlg.addEventListener('change',upd);
    $('#a-cancel',dlg).onclick=close;
    ok.onclick=()=>{
      if(conflictPending){conflictPending=false;c.version++;close();NOTICE=errBox(409,'CONFLICT','VERSION_CONFLICT','This case changed while you were reviewing it. The latest version has been reloaded. Please review it and try again.','context.current_version: '+c.version);render();announce('This case changed. Latest version reloaded.');return}
      if($('#mock-state').value==='error'){$('#a-err',dlg).innerHTML=errBox(503,'AUDIT_UNAVAILABLE',null,'The audit write failed, so nothing was changed. Try again shortly.');return}
      const dec={decision_id:'dec_01J8ZKD'+String(Math.floor(Math.random()*90)+10),case_id:c.case_id,action:comp?null:action,compliance_outcome:comp?$('input[name=a-out]:checked',dlg).value:null,reason:t.value.trim(),reviewer_persona:persona(),overrode_ai:(action==='REJECT'||action==='MODIFY')&&c.source==='AI',case_version_after:c.version+1};
      dec.note=isNote?t.value.trim():null;
      c.version++;c.decisions.push(dec);
      let out=`<strong>200 DecisionResult.</strong> ${comp?'Compliance outcome '+dec.compliance_outcome:'Action '+action} recorded as <code>${dec.decision_id}</code>; case version is now ${c.version}.`;
      if(action==='REQUEST_MORE_INFORMATION'){c.status='AWAITING_INFORMATION'}
      else if(action==='ESCALATE'){c.status='RE_ROUTED';const er=$('#a-esc',dlg).value;const n=mk('N'+Math.floor(Math.random()*90+10),er,ROUTE_Q[er],c.priority,'OPEN','REVIEWER',0,c.customer_name,c.customer_id,c.account_id,1);n.reason=er;CASES.push(n);out+=` Re-routed to <strong>${n.queue}</strong> as new case <code>${n.case_id}</code> (parent_case_id set).`}
      else{c.status='DECIDED';if(action==='APPROVE'&&c.reason==='EXCEPTIONAL_ARRANGEMENT')out+=` An arrangement was created with exactly the customer's requested terms (created_via EXCEPTION_APPROVAL).`;if(action==='MODIFY')out+=` A pending ARRANGEMENT proposal was created; the customer must confirm it before anything takes effect.`;if(dec.overrode_ai)out+=' Recorded as an AI override (overrode_ai true).'}
      NOTICE=banner('ok',out,null,'status');close();render();announce('Decision recorded');
    };
   }});
}

initMockbar();
$('#mock-state').addEventListener('change',()=>{if(typeof resetState==='function')resetState();render()});
render();
</script>
</body>
</html>
