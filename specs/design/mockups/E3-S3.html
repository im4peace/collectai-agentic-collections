<title>E3-S3 Delinquent Portfolio - CollectAI mockup</title>
<!--
  Mockup for story E3-S3: Delinquent Portfolio
  Self-contained: inline CSS and vanilla JS only, no CDN, no web fonts, no network calls.
  Synthetic data only (fictional names, example.com, +1-555-01xx). Payments are simulated.
  Field names, enums and shapes follow specs/design/api-contracts.md (snake_case, money as 2dp strings).
  Contract gaps noted while building this mockup:
  - PortfolioItem has no product_name, so the product type column shows the AccountType enum label (Card, Personal loan).
  - PortfolioPage carries no snapshot freshness per row, so no stale marker is shown in the list.
-->

<div class="mockbar" data-bg>
  <strong>Mockup E3-S3</strong><span class="muted">controls below are not part of the product UI</span>
  <label>State: <select id="mock-state" aria-label="Mockup state toggle">
<option value="happy">Happy path: portfolio loaded</option>

</div>

  <header class="appbar" id="appbar"></header>
  <main id="main" tabindex="-1"></main>
</div>
<div id="sr-live" class="sr" aria-live="polite" aria-atomic="true"></div>
<div id="toast" class="toast" role="status" hidden></div>
<script>
/* ---- shared mockup helpers (inlined per file; no external deps) ---- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=l=>`<span class="api" data-api="${esc(l)}" title="API call">${esc(l)}</span>`;
const money=s=>{const m=String(s).match(/^(-?)(\d+)\.(\d{2})$/);return m?`${m[1]}AED ${m[2].replace(/\B(?=(\d{3})+(?!\d))/g,',')}.${m[3]}`:esc(s)};
const cents=s=>{const m=String(s).trim().match(/^(\d+)(?:\.(\d{1,2}))?$/);return m?BigInt(m[1])*100n+BigInt((m[2]||'').padEnd(2,'0')||'0'):null};
const fromCents=c=>{const n=c<0n?-c:c;const s=n.toString().padStart(3,'0');return (c<0n?'-':'')+s.slice(0,-2)+'.'+s.slice(-2)};
const pct4=v=>{if(v==null)return '-';const [i,f='']=String(v).split('.');const n=BigInt(i+f.padEnd(4,'0').slice(0,4));const s=n.toString().padStart(3,'0');return s.slice(0,-2)+'.'+s.slice(-2)+'%'};
const fmtDT=t=>{if(!t)return '-';const d=new Date(t),z=new Date(d.getTime()+14400000),p=n=>String(n).padStart(2,'0');return `${z.getUTCFullYear()}-${p(z.getUTCMonth()+1)}-${p(z.getUTCDate())} ${p(z.getUTCHours())}:${p(z.getUTCMinutes())} GST`};

const chip=(t,c,i)=>`<span class="chip ${c}">${i?`<span aria-hidden="true">${i}</span>`:''}${esc(t)}</span>`;
const bandChip=b=>({HIGH:chip('HIGH priority','danger','▲'),MEDIUM:chip('MEDIUM priority','warn','◆'),LOW:chip('LOW priority','ok','▼')}[b]);

function announce(msg){const l=$('#sr-live');l.textContent='';setTimeout(()=>{l.textContent=msg},40)}
let _tt;function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(_tt);_tt=setTimeout(()=>{t.hidden=true},3200);announce(msg)}
function setShell(persona,current,opts={}){
  const layout=persona==='CUSTOMER'?'Customer':'Internal';

}
document.addEventListener('click',e=>{const a=e.target.closest('a[data-route]');if(a){e.preventDefault();if(window.onRoute)window.onRoute(a.dataset.route,a.textContent);else toast('Mockup: would navigate to '+a.dataset.route)}});

function openDialog({title,body,trigger,restore,focusSel,onMount}){
  const prev=trigger||document.activeElement;
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t" tabindex="-1"><h2 id="dlg-t">${title}</h2><div>${body}</div></div>`;
  document.body.appendChild(ov);const dlg=ov.firstElementChild;
  const bg=$$('[data-bg]');bg.forEach(e=>{e.inert=true;e.setAttribute('aria-hidden','true')});
  const foc=()=>$$('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])',dlg).filter(e=>!e.hidden);
  function close(){document.removeEventListener('keydown',key,true);ov.remove();bg.forEach(e=>{e.inert=false;e.removeAttribute('aria-hidden')});
    const t=document.contains(prev)?prev:(restore?$(restore):null);if(t&&t.focus)t.focus()}

    if(e.key==='Escape'){e.stopPropagation();close();return}
    if(e.key==='Tab'){const f=foc();if(!f.length){e.preventDefault();return}const a=document.activeElement;

  document.addEventListener('keydown',key,true);
  if(onMount)onMount(dlg,close);
  const fi=(focusSel&&$(focusSel,dlg))||foc()[0]||dlg;fi.focus();
  return close;
}

const STATUSES=['NEW','IN_PROGRESS','PTP_PENDING','ARRANGEMENT_ACTIVE','ESCALATED'];
const BANDS=['HIGH','MEDIUM','LOW'];
const F={dpd_min:'',dpd_max:'',priority_band:[],status:[],sort_by:'priority_score',sort_dir:'desc'};
function resetState(){Object.assign(F,{dpd_min:'',dpd_max:'',priority_band:[],status:[],sort_by:'priority_score',sort_dir:'desc'})}
function queryString(){const p=new URLSearchParams();if(F.dpd_min!=='')p.set('dpd_min',F.dpd_min);if(F.dpd_max!=='')p.set('dpd_max',F.dpd_max);F.priority_band.forEach(b=>p.append('priority_band',b));F.status.forEach(s=>p.append('status',s));p.set('sort_by',F.sort_by);p.set('sort_dir',F.sort_dir);return '?'+p.toString()}
function filtered(){
  let r=ITEMS.filter(i=>(F.dpd_min===''||i.dpd>=+F.dpd_min)&&(F.dpd_max===''||i.dpd<=+F.dpd_max)&&(!F.priority_band.length||F.priority_band.includes(i.priority_band))&&(!F.status.length||F.status.includes(i.collection_status)));
  const k=F.sort_by,dir=F.sort_dir==='asc'?1:-1;
  const val=i=>k==='dpd'?BigInt(i.dpd):cents(k==='overdue_amount'?i.overdue_amount:i.priority_score);
  r.sort((a,b)=>{const x=val(a),y=val(b);if(x!==y)return (x<y?-1:1)*dir;return a.account_id<b.account_id?-1:1});
  return r;
}
function sortTh(key,label,cls){
  const on=F.sort_by===key;const aria=on?(F.sort_dir==='asc'?'ascending':'descending'):'none';
  return `<th scope="col" class="${cls||''}" aria-sort="${aria}"><button type="button" class="sort" data-sort="${key}" data-api="GET /api/portfolio?sort_by=${key}">${label}<span aria-hidden="true">${on?(F.sort_dir==='asc'?'▲':'▼'):'↕'}</span></button></th>`;
}
function render(){
  const st=$('#mock-state').value;
  if(st==='forbidden'){setShell('COLLECTIONS_MANAGER','');$('#main').innerHTML=forbiddenPage('COLLECTIONS_MANAGER','/portfolio');return}
  setShell('COLLECTIONS_OFFICER','Portfolio',{demoFlag:true});
  const head=`<div class="pagehead"><div><h1>Delinquent portfolio</h1><p class="muted">Accounts with overdue amount greater than 0.00. Priority is calculated by the rules engine, not by AI.</p></div><div>${api('GET /api/portfolio')}<br><span class="tag rules"><span aria-hidden="true">▦</span>Rules engine</span></div></div>`;
  if(st==='error'){$('#main').innerHTML=head+errBox(503,'POLICY_UNAVAILABLE',null,'No valid active PolicyRuleSet. The portfolio fails closed and shows no priorities.','<button type="button" class="btn secondary" id="retry">Retry</button> '+api('GET /api/portfolio'))+`<p class="muted">Manual work continues from Customer 360 by account id.</p>`;$('#retry').onclick=()=>toast('Mockup: retry would call GET /api/portfolio');return}
  const rows=filtered();
  const filters=`<form class="panel" id="filters" aria-label="Portfolio filters" novalidate>
   <div class="ph"><h2>Filters</h2>${api('GET /api/portfolio?dpd_min&dpd_max&priority_band&status')}</div>
   <div class="row" style="align-items:flex-start;gap:14px">
    <label class="f">DPD min (dpd_min)<input type="number" min="0" inputmode="numeric" name="dpd_min" value="${esc(F.dpd_min)}" style="width:110px"></label>
    <label class="f">DPD max (dpd_max)<input type="number" min="0" inputmode="numeric" name="dpd_max" value="${esc(F.dpd_max)}" style="width:110px"></label>
    <fieldset><legend>Priority band (priority_band)</legend><div class="checks">${BANDS.map(b=>`<label><input type="checkbox" name="priority_band" value="${b}" ${F.priority_band.includes(b)?'checked':''}>${b}</label>`).join('')}</div></fieldset>
    <fieldset><legend>Status (status)</legend><div class="checks">${STATUSES.map(s=>`<label><input type="checkbox" name="status" value="${s}" ${F.status.includes(s)?'checked':''}>${s}</label>`).join('')}</div></fieldset>
    <button type="button" class="btn secondary" id="clear" style="align-self:flex-end">Clear filters</button>
   </div>
   <p class="small muted" style="margin-bottom:0">URL query: <code id="qs">${esc(queryString())}</code> &middot; Request: <code>GET /api/portfolio${esc(queryString())}</code></p></form>`;
  let table;
  if(!rows.length){table=`<div class="empty" role="status"><strong>No accounts match these filters.</strong><p>Widen the DPD range or clear filters to see the full list.</p><button type="button" class="btn" id="clear2">Clear filters</button></div>`}
  else{
    table=`<div class="tablewrap"><table aria-describedby="cap"><caption id="cap" class="sr">Delinquent accounts, ${rows.length} rows. Sorted by ${F.sort_by} ${F.sort_dir==='asc'?'ascending':'descending'}.</caption>
    <thead><tr><th scope="col">Customer</th><th scope="col">Product type</th><th scope="col" class="num">Balance</th>${sortTh('overdue_amount','Overdue','num')}${sortTh('dpd','DPD','num')}<th scope="col">Bucket</th><th scope="col">Status</th><th scope="col" aria-sort="${F.sort_by==='priority_score'?(F.sort_dir==='asc'?'ascending':'descending'):'none'}">Priority band</th></tr></thead><tbody>
    ${rows.map(i=>`<tr class="clickable" data-open="${i.account_id}" data-record-version="${i.record_version}"><td><a href="/customers/${i.account_id}" data-open-link="${i.account_id}"><strong>${esc(i.customer_name)}</strong></a><br><span class="small muted mono">${i.account_id}</span>${i.human_treatment?'<br>'+chip('Human treatment','info','☺'):''}</td>
     <td title="${i.account_type}">${TYPE_L[i.account_type]}</td><td class="num">${money(i.outstanding_balance)}</td><td class="num"><strong>${money(i.overdue_amount)}</strong></td><td class="num">${i.dpd}</td><td title="${i.bucket}">${BUCKET_L[i.bucket]}</td><td>${chip(i.collection_status.replace(/_/g,' '),'neutral')}</td>
     <td>${bandChip(i.priority_band)}<br><span class="small muted">Score ${i.priority_score} (system-calculated)</span></td></tr>`).join('')}
    </tbody></table></div>`;
  }
  $('#main').innerHTML=head+`<div id="navnote" aria-live="polite"></div>`+filters+`<div class="row" style="margin:12px 0 6px;justify-content:space-between"><h2 style="margin:0">Accounts</h2><span class="small muted" role="status">Showing ${rows.length} of ${ITEMS.length} sample accounts &middot; page.limit 50, page.offset 0, page.total ${rows.length} &middot; policy_version policy-v1</span></div>`+table+`<p class="footnote">Click a row or press Enter on the customer name to open Customer 360 at <code>/customers/{account_id}</code> (${api('GET /api/customers/{account_id}/360')}). Money is a 2dp string and is compared as decimal, never as float.</p>`;
  wire();
}
function wire(){
  const form=$('#filters');if(!form)return;
  const sync=()=>{F.dpd_min=$('[name=dpd_min]',form).value;F.dpd_max=$('[name=dpd_max]',form).value;F.priority_band=$$('input[name=priority_band]:checked',form).map(x=>x.value);F.status=$$('input[name=status]:checked',form).map(x=>x.value);try{history.replaceState(null,'',queryString())}catch(e){}
    const a=document.activeElement;const sel=a&&a.name?`#filters [name="${a.name}"]`+(a.type==='checkbox'?`[value="${a.value}"]`:''):null;render();if(sel){const el=$(sel);if(el)el.focus()}announce($$('tbody tr').length+' accounts shown')};
  form.addEventListener('change',sync);form.addEventListener('submit',e=>e.preventDefault());
  const clear=()=>{resetState();try{history.replaceState(null,'','?')}catch(e){}render();announce('Filters cleared, full list restored');const c=$('#clear');if(c)c.focus()};
  $('#clear').onclick=clear;const c2=$('#clear2');if(c2)c2.onclick=clear;
  $$('button[data-sort]').forEach(b=>b.onclick=()=>{const k=b.dataset.sort;if(F.sort_by===k)F.sort_dir=F.sort_dir==='asc'?'desc':'asc';else{F.sort_by=k;F.sort_dir='desc'}try{history.replaceState(null,'',queryString())}catch(e){}render();const nb=$(`button[data-sort=${k}]`);if(nb)nb.focus();announce('Sorted by '+k+' '+(F.sort_dir==='asc'?'ascending':'descending'))});
  const open=id=>{$('#navnote').innerHTML=banner('info',`Navigated to <code>/customers/${esc(id)}</code> (Customer 360, story E4-S2). ${api('GET /api/customers/'+id+'/360')} <button type="button" class="btn link" id="back">Back to portfolio</button>`);$('#back').onclick=()=>{$('#navnote').innerHTML='';const r=$(`tr[data-open=${id}] a`);if(r)r.focus()};announce('Opening Customer 360 for '+id)};
  $$('tr[data-open]').forEach(tr=>tr.addEventListener('click',e=>{if(e.target.closest('a'))return;open(tr.dataset.open)}));
  $$('a[data-open-link]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();open(a.dataset.openLink)}));
}

initMockbar();
$('#mock-state').addEventListener('change',()=>{if(typeof resetState==='function')resetState();render()});
render();
</script>
</body>
</html>
