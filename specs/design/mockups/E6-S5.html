<!--
  Mockup for story E6-S5: AI Collections Chat
  Self-contained: inline CSS and vanilla JS only, no CDN, no web fonts, no network calls.
  Synthetic data only (fictional names, example.com, +1-555-01xx). Payments are simulated.
  Field names, enums and shapes follow specs/design/api-contracts.md (snake_case, money as 2dp strings).
  Contract gaps noted while building this mockup:
  - ChatMessage has no proposal_id, and ConversationDetail exposes only one pending_proposal, so confirmed or cancelled proposal cards cannot be rebuilt when history is reloaded.
  - When the provider fails, the contract creates an AI_FAILURE_FALLBACK escalation but ChatTurnResponse.handoff is described as a human handoff; unclear whether a case reference is shown to the customer in that state.
  - Confirm errors use CONFLICT/PROPOSAL_INVALID but the customer-safe message text is not specified; the mockup uses its own copy.
-->

<div class="mockbar" data-bg>
  <strong>Mockup E6-S5</strong><span class="muted">controls below are not part of the product UI</span>

<option value="happy">Happy path</option>

<script>
/* ---- shared mockup helpers (inlined per file; no external deps) ---- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=l=>`<span class="api" data-api="${esc(l)}" title="API call">${esc(l)}</span>`;
const money=s=>{const m=String(s).match(/^(-?)(\d+)\.(\d{2})$/);return m?`${m[1]}AED ${m[2].replace(/\B(?=(\d{3})+(?!\d))/g,',')}.${m[3]}`:esc(s)};
const cents=s=>{const m=String(s).trim().match(/^(\d+)(?:\.(\d{1,2}))?$/);return m?BigInt(m[1])*100n+BigInt((m[2]||'').padEnd(2,'0')||'0'):null};
const fromCents=c=>{const n=c<0n?-c:c;const s=n.toString().padStart(3,'0');return (c<0n?'-':'')+s.slice(0,-2)+'.'+s.slice(-2)};
const pct4=v=>{if(v==null)return '-';const [i,f='']=String(v).split('.');const n=BigInt(i+f.padEnd(4,'0').slice(0,4));const s=n.toString().padStart(3,'0');return s.slice(0,-2)+'.'+s.slice(-2)+'%'};
const fmtDT=t=>{if(!t)return '-';const d=new Date(t),z=new Date(d.getTime()+14400000),p=n=>String(n).padStart(2,'0');return `${z.getUTCFullYear()}-${p(z.getUTCMonth()+1)}-${p(z.getUTCDate())} ${p(z.getUTCHours())}:${p(z.getUTCMinutes())} GST`};
const PN={CUSTOMER:'Customer',COLLECTIONS_OFFICER:'Collections Officer',COLLECTIONS_MANAGER:'Collections Manager',COMPLIANCE_RISK:'Compliance and Risk'};
const NAV={CUSTOMER:[['Chat','/chat']],COLLECTIONS_OFFICER:[['Portfolio','/portfolio'],['Customer 360','/customers/acc_000123'],['Escalations','/escalations'],['Review queues','/review-queues'],['Demo controls','/demo-controls',true]],COLLECTIONS_MANAGER:[['Dashboard','/dashboard']],COMPLIANCE_RISK:[['Audit Trail','/audit'],['Compliance review queue','/compliance-review']]};
const chip=(t,c,i)=>`<span class="chip ${c}">${i?`<span aria-hidden="true">${i}</span>`:''}${esc(t)}</span>`;
const bandChip=b=>({HIGH:chip('HIGH priority','danger','▲'),MEDIUM:chip('MEDIUM priority','warn','◆'),LOW:chip('LOW priority','ok','▼')}[b]);
const TAGS={rules:['▦','Rules engine'],ai:['✦','AI-generated'],sim:['◇','Simulated'],rec:['▤','System record']};
const tag=k=>`<span class="tag ${k}"><span aria-hidden="true">${TAGS[k][0]}</span>${TAGS[k][1]}</span>`;
const banner=(k,html,icon,role)=>`<div class="banner ${k}" ${role===false?'':`role="${role||(k==='danger'?'alert':'status')}"`}><span class="bi" aria-hidden="true">${icon||({warn:'⚠',danger:'✖',info:'ℹ',ok:'✔',ai:'✦'}[k])}</span><div>${html}</div></div>`;
const errBox=(status,code,reason,msg,extra)=>banner('danger',`<strong>${status} ${esc(code)}${reason?' / '+esc(reason):''}</strong><br>${esc(msg)}${extra?'<br>'+extra:''}<br><span class="small muted">correlation_id: <code>c0ffee1234abcd</code></span>`);
function announce(msg){const l=$('#sr-live');l.textContent='';setTimeout(()=>{l.textContent=msg},40)}
let _tt;function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(_tt);_tt=setTimeout(()=>{t.hidden=true},3200);announce(msg)}
function setShell(persona,current,opts={}){
  const layout=persona==='CUSTOMER'?'Customer':'Internal';
  const nav=(NAV[persona]||[]).filter(n=>!n[2]||opts.demoFlag);
  $('#appbar').innerHTML=`<div class="brand"><span aria-hidden="true">◈</span> CollectAI <span class="env">${layout} layout</span></div>
  <nav aria-label="Main navigation">${nav.map(n=>`<a href="${n[1]}" data-route="${n[1]}" ${n[0]===current?'aria-current="page"':''}>${n[0]}</a>`).join('')}</nav>
  <div class="who"><span class="chip demo">Demo persona - not real authentication</span><span id="persona-chip" role="status" aria-live="polite">Current persona: <strong>${PN[persona]}</strong> <code>${persona}</code></span></div>`;
}
document.addEventListener('click',e=>{const a=e.target.closest('a[data-route]');if(a){e.preventDefault();if(window.onRoute)window.onRoute(a.dataset.route,a.textContent);else toast('Mockup: would navigate to '+a.dataset.route)}});
const forbiddenPage=(persona,route)=>`<section class="forbidden" role="alert" aria-labelledby="fh"><h1 id="fh"><span aria-hidden="true">⛔</span> 403 - Forbidden</h1><p>The persona <strong>${esc(persona)}</strong> cannot open <code>${esc(route)}</code>.</p><p class="muted">No restricted data was requested or rendered. The API would answer <code>403 FORBIDDEN</code> and write an <code>ACCESS_DENIED</code> audit event.</p>${api('403 FORBIDDEN (no data fetched)')}</section>`;
function openDialog({title,body,trigger,restore,focusSel,onMount}){
  const prev=trigger||document.activeElement;
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t" tabindex="-1"><h2 id="dlg-t">${title}</h2><div>${body}</div></div>`;
  document.body.appendChild(ov);const dlg=ov.firstElementChild;
  const bg=$$('[data-bg]');bg.forEach(e=>{e.inert=true;e.setAttribute('aria-hidden','true')});
  const foc=()=>$$('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])',dlg).filter(e=>!e.hidden);
  function close(){document.removeEventListener('keydown',key,true);ov.remove();bg.forEach(e=>{e.inert=false;e.removeAttribute('aria-hidden')});
    const t=document.contains(prev)?prev:(restore?$(restore):null);if(t&&t.focus)t.focus()}
  function key(e){
    if(e.key==='Escape'){e.stopPropagation();close();return}
    if(e.key==='Tab'){const f=foc();if(!f.length){e.preventDefault();return}const a=document.activeElement;
      if(e.shiftKey&&(a===f[0]||!dlg.contains(a))){e.preventDefault();f[f.length-1].focus()}
      else if(!e.shiftKey&&(a===f[f.length-1]||!dlg.contains(a))){e.preventDefault();f[0].focus()}}}
  document.addEventListener('keydown',key,true);
  if(onMount)onMount(dlg,close);
  const fi=(focusSel&&$(focusSel,dlg))||foc()[0]||dlg;fi.focus();
  return close;
}
function initMockbar(){
  const t=$('#theme-btn');t.addEventListener('click',()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark';t.textContent='Theme: '+(dark?'light':'dark')+' (toggle)'});
}

/* ---- page script: E6-S5 ---- */
/* E6-S5 AI Collections Chat (customer layout). Shapes: ChatMessage, Proposal, ConfirmResult, HandoffResult, ChatTurnResponse (api-contracts.md 3.8, section 4). */

const CONV='conv_01J8ZK4A9B',ACC='acc_000123',OVERDUE='612.40',BALANCE='4820.35';
let M=[],pending=null,handoff=null,busy=false,seq=1,convStatus='ACTIVE',lastTrigger=null;
function msg(role,content,src,labels){return {message_id:'msg_01J8ZK4'+String(seq++).padStart(3,'0'),conversation_id:CONV,role,content,content_source:src,labels:labels||[],created_at:'2026-10-01T14:3'+Math.min(seq,9)+':00Z'}}
function resetState(){M=[msg('ASSISTANT',"Hi Priya. I'm an AI assistant for CollectAI, not a person. I can help you promise a payment date, make a simulated payment, or ask about a payment plan. You can talk to a human colleague at any time with the button above. Payments in this demo are simulated and no real money moves.",'TEMPLATE',['AI_DISCLOSURE'])];pending=null;handoff=null;busy=false;convStatus='ACTIVE'}
const LABEL={AI_DISCLOSURE:chip('AI disclosure','ai','✦'),SIMULATED:chip('Simulated payment','sim','◇'),HUMAN_HANDOFF:chip('Human handoff','info','☺'),SAFE_FALLBACK:chip('Safe message','warn','⚠')};
const hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0}return h.toString(16).padStart(8,'0')+'c41e07b2'};
function mkProposal(kind,terms,summary){const id='prp_01J8ZK4C'+String(seq++).padStart(2,'0');return {proposal_id:id,conversation_id:CONV,kind,status:'PENDING_CONFIRMATION',terms,terms_hash:hash(JSON.stringify(terms)),summary,simulated:kind==='PAYMENT',record_version:7,created_at:'2026-10-01T14:32:00Z',expires_at:'2026-10-01T15:32:00Z'}}
function msgHtml(m){
  if(m.role==='SYSTEM')return `<div class="msg s" role="${m.err?'alert':'group'}"><div class="who">Notice</div>${esc(m.content)}${m.extra||''}</div>`;
  if(m.role==='CUSTOMER')return `<div class="msg c"><div class="who">You</div>${esc(m.content)}</div>`;
  return `<div class="msg a"><div class="who"><span aria-hidden="true">✦</span> AI assistant <span class="small" style="font-weight:400">(${m.content_source==='TEMPLATE'?'template':'model'} text)</span></div>${esc(m.content)}${m.labels.length?`<div class="chips">${m.labels.map(l=>LABEL[l]).join('')}</div>`:''}</div>`;
}
function proposalCard(p){
  const done=p.status!=='PENDING_CONFIRMATION';
  return `<div class="pcard" data-proposal="${p.proposal_id}"><div class="row" style="justify-content:space-between"><strong>${p.kind==='PTP'?'Promise to pay':p.kind==='PAYMENT'?'Payment':'Payment plan'}</strong>${done?chip(p.status,p.status==='CONFIRMED'?'ok':'neutral',p.status==='CONFIRMED'?'✔':'-'):chip('Awaiting your confirmation','warn','○')}</div>${p.simulated?'<p style="margin:4px 0">'+chip('Simulated payment - no real money moves','sim','◇')+'</p>':''}<p class="small" style="margin:4px 0">${esc(p.summary)}</p>${done?'':`<button type="button" class="btn secondary" data-review="${p.proposal_id}">Review and confirm</button>`}</div>`;
}
function proposalBody(p,err){
  const t=p.terms;let rows='';
  if(p.kind==='PTP')rows=`<dt>promised_amount</dt><dd>${money(t.promised_amount)}</dd><dt>promised_date</dt><dd>${t.promised_date}</dd>`;
  if(p.kind==='PAYMENT')rows=`<dt>payment_option</dt><dd>${t.payment_option}</dd><dt>payment_amount</dt><dd>${money(t.payment_amount)}</dd><dt>simulated</dt><dd>true</dd>`;
  if(p.kind==='ARRANGEMENT')rows=`<dt>installments</dt><dd>${t.option.installment_count} monthly</dd><dt>total_amount</dt><dd>${money(t.option.total_amount)}</dd><dt>schedule</dt><dd>${t.option.schedule.map(s=>`${s.due_date}: ${money(s.amount)}`).join('<br>')}</dd>`;
  return `${p.simulated?`<p>${chip('Simulated payment - no real money moves','sim','◇')}</p>`:''}<p>${esc(p.summary)}</p><dl class="kv">${rows}<dt>Offer valid until</dt><dd>${fmtDT(p.expires_at)}</dd><dt>terms_hash</dt><dd class="mono">${p.terms_hash.slice(0,12)}...</dd></dl><p class="small muted">Amounts were calculated by our system, not by the AI. Nothing is submitted until you press Confirm.</p><div id="dlg-err" role="alert">${err||''}</div>
  <div class="dlg-actions"><button type="button" class="btn secondary" id="d-cancel" data-api="POST .../proposals/${p.proposal_id}/cancel">Cancel</button><button type="button" class="btn" id="d-confirm" data-api="POST .../proposals/${p.proposal_id}/confirm">Confirm</button></div>
  <p class="small muted" style="margin:0">${api('POST /api/chat/conversations/'+CONV+'/proposals/'+p.proposal_id+'/confirm')} ${api('POST .../cancel')}<br><span class="mono small">Idempotency-Key: confirm-${p.proposal_id}-01 &middot; body {"terms_hash":"${p.terms_hash.slice(0,8)}..."}</span></p>`;
}
function openProposal(p,trigger){
  const title=p.kind==='PTP'?'Confirm your promise to pay':p.kind==='PAYMENT'?'Confirm your simulated payment':'Confirm your payment plan';
  openDialog({title,trigger,restore:'#msg',focusSel:'#d-confirm',body:proposalBody(p),onMount:(dlg,close)=>{
    let invalid=false;
    $('#d-cancel',dlg).onclick=()=>{
      if(invalid){p.status='INVALIDATED';pending=null;M.push({...msg('SYSTEM','That offer is no longer valid because your account changed. Nothing was created. Ask me again for a fresh offer.','TEMPLATE',[])});draw(true);close();return}
      p.status='CANCELLED';pending=null;M.push(msg('ASSISTANT',"No problem, I've cancelled that. Nothing was created or changed.",'TEMPLATE',[]));draw(true);close()};
    $('#d-confirm',dlg).onclick=()=>{
      if($('#mock-state').value==='stale'){invalid=true;$('#dlg-err',dlg).innerHTML=errBox(409,'CONFLICT','PROPOSAL_INVALID','This offer is no longer valid because your account details changed. Nothing was created.');$('#d-confirm',dlg).disabled=true;$('#d-cancel',dlg).textContent='Close';$('#d-cancel',dlg).focus();return}
      p.status='CONFIRMED';pending=null;let text,labels=[];
      if(p.kind==='PTP'){text=`Done. Your promise of ${money(p.terms.promised_amount)} by ${p.terms.promised_date} is recorded (ptp_01J8ZK4E01). We will not contact you about this amount before then.`}
      else if(p.kind==='PAYMENT'){const bal=fromCents(cents(BALANCE)-cents(p.terms.payment_amount));text=`Simulated payment of ${money(p.terms.payment_amount)} recorded (pay_01J8ZK4F01). No real money moved. Balance after this simulated payment: ${money(bal)}.`;labels=['SIMULATED']}
      else{text=`Your payment plan is set up: ${p.terms.option.installment_count} monthly installments totalling ${money(p.terms.option.total_amount)}, starting ${p.terms.option.first_installment_date} (arr_01J8ZK4G01).`}
      M.push(msg('ASSISTANT',text,'TEMPLATE',labels));draw(true);close()}
  }});
}
function draw(scroll){
  const log=$('#log');if(!log)return;
  log.innerHTML=M.map((m,i)=>msgHtml(m)+(m.proposal?proposalCard(m.proposal):'')).join('')+(busy?'<div class="msg a" aria-hidden="true"><div class="who">✦ AI assistant</div><em>Thinking...</em></div>':'')+(handoff?`<div class="pcard" style="border-color:var(--ok)"><strong>${chip('Request received','ok','✔')} Reference ${handoff.case_id}</strong><p class="small" style="margin:4px 0 0">${esc(handoff.customer_message)} Status: ${handoff.status}.</p></div>`:'');
  $$('button[data-review]',log).forEach(b=>b.onclick=()=>{openProposal(pending,b)});
  if(scroll)log.scrollTop=log.scrollHeight;
  const hs=$('#hstat');if(hs)hs.innerHTML=convStatus==='HANDED_OFF'?chip('Handed off - a colleague will follow up','info','☺'):chip('AI assistant','ai','✦');
}
function reply(text){
  const st=$('#mock-state').value;
  if(st==='ai_down'){M.push(msg('ASSISTANT',"I can't help with that right now because my AI service is unavailable. Nothing has been changed. You can talk to a human colleague using the button above.",'TEMPLATE',['SAFE_FALLBACK']));
    M[M.length-1].extra='';M.push({...msg('SYSTEM','Safe state AI_UNAVAILABLE. A review case (AI_FAILURE_FALLBACK) was queued so a colleague can look at this.','TEMPLATE',[])});return}
  if(/human|person|someone|agent/i.test(text)){doHandoff(true);return}
  if(/plan|instal/i.test(text)){
    const opt={option_id:'opt-3-2026-10-15',installment_count:3,installment_amount:'204.13',final_installment_amount:'204.14',total_amount:OVERDUE,first_installment_date:'2026-10-15',frequency:'MONTHLY',schedule:[{sequence:1,due_date:'2026-10-15',amount:'204.13'},{sequence:2,due_date:'2026-11-15',amount:'204.13'},{sequence:3,due_date:'2026-12-15',amount:'204.14'}]};
    pending=mkProposal('ARRANGEMENT',{kind:'ARRANGEMENT',option:opt},'3 monthly installments of AED 204.13 (last AED 204.14), total AED 612.40, first due 2026-10-15.');
    M.push({...msg('ASSISTANT','Here is a plan you are eligible for, calculated by our system. Please review it. Nothing is set up until you confirm.','TEMPLATE',[]),proposal:pending});return}
  const money_=text.match(/(\d+(?:\.\d{1,2})?)/),day=text.match(/(\d{1,2})(?:st|nd|rd|th)/);
  if(/pay/i.test(text)&&(/now|today|overdue|all/i.test(text)||!money_)){
    pending=mkProposal('PAYMENT',{kind:'PAYMENT',payment_option:'OVERDUE_AMOUNT',payment_amount:OVERDUE,simulated:true,simulated_label:'Simulated payment - no real money moves'},'Simulated payment of your overdue amount, AED 612.40.');
    M.push({...msg('ASSISTANT','You can pay your overdue amount of AED 612.40 now. This is a simulated payment. Please review and confirm.','TEMPLATE',['SIMULATED']),proposal:pending});return}
  if(money_&&/pay|by|on|before/i.test(text)){
    const amt=cents(money_[1].includes('.')?money_[1]:money_[1]+'.00');
    if(amt>cents(OVERDUE)){M.push(msg('ASSISTANT',`The most you can promise right now is ${money(OVERDUE)}. Would you like to promise that amount, or a smaller one?`,'TEMPLATE',[]));return}
    const d='2026-10-'+String(day&&+day[1]>=1&&+day[1]<=31?day[1]:15).padStart(2,'0');
    pending=mkProposal('PTP',{kind:'PTP',promised_amount:fromCents(amt),promised_date:d},`Promise ${money(fromCents(amt))} by ${d}.`);
    M.push({...msg('ASSISTANT',`You can promise ${money(fromCents(amt))} by ${d}. Please review and confirm. Nothing is recorded until you confirm.`,'TEMPLATE',[]),proposal:pending});return}
  M.push(msg('ASSISTANT','I can help you promise a payment date, pay your overdue amount (simulated), or look at a payment plan. What would you like to do?','MODEL',[]));
}
function doHandoff(fromMsg){
  const st=$('#mock-state').value;
  if(handoff){announce('Your request is already with a colleague. Reference '+handoff.case_id);toast('Already requested: '+handoff.case_id);return}
  if(st==='handoff_fail'){M.push({role:'SYSTEM',content:'We could not complete your request to reach a colleague. Nothing was lost. Next step: call us on +1-555-0100 during business hours, or press "Talk to a human" again in a minute.',err:true,extra:`<div class="small" style="margin-top:4px">${api('503 HANDOFF_FAILED')} <span class="muted">Automated reminders on this account stay paused.</span></div>`});draw(true);return}
  handoff={case_id:'esc_01J8ZK8A11',account_id:ACC,status:'OPEN',customer_message:'A human colleague will follow up with you.',created_at:'2026-10-01T14:34:00Z',decided_at:null};convStatus='HANDED_OFF';
  M.push(msg('ASSISTANT','Thank you. A human colleague will follow up with you. Your reference is esc_01J8ZK8A11. Automated reminders are paused while a person reviews your account.','TEMPLATE',['HUMAN_HANDOFF']));draw(true);
}
function render(){
  if(!M.length)resetState();
  setShell('CUSTOMER','Chat');
  const st=$('#mock-state').value;
  $('#main').innerHTML=`<div class="chatwrap"><div class="chat"><div class="chat-h"><div><h1>Collections assistant</h1><span id="hstat"></span></div><button type="button" class="talk" id="talk" data-api="POST /api/chat/conversations/{id}/handoff">Talk to a human</button></div>
   <div class="acct"><span>${esc('Everyday Rewards Card')}</span><span>Overdue <strong>${money(OVERDUE)}</strong></span><span>Balance ${money(BALANCE)}</span><span>${api('GET /api/me/accounts/'+ACC)}</span></div>
   <div id="log" class="log" role="log" aria-live="polite" aria-relevant="additions" aria-label="Conversation with AI assistant" tabindex="0"></div>
   <div class="sugg" aria-label="Suggested messages"><span class="small muted" style="align-self:center">Try:</span>${['I can pay 250.00 by the 15th','I want to pay my overdue amount now','Can I set up a payment plan?'].map(t=>`<button type="button" data-s="${esc(t)}">${esc(t)}</button>`).join('')}</div>
   <form class="composer" id="cf" novalidate><label class="sr" for="msg">Message to the assistant (Enter to send, Shift+Enter for a new line)</label><textarea id="msg" maxlength="2000" rows="1" placeholder="Type your message"></textarea><button type="submit" class="btn" id="send" data-api="POST /api/chat/conversations/{id}/messages">Send</button></form>
   <p class="small muted" style="padding:0 12px 8px;margin:0;background:var(--surface)">${api('POST /api/chat/conversations/{id}/messages')} ${api('POST .../handoff')} &middot; You are chatting with an AI. State: <code>${st}</code></p></div>
   <p class="footnote">Demo: payments are simulated and no real payment occurs. Session bound to customer <code>cus_0041</code> server-side; the browser never sends a customer id.</p></div>`;
  draw(true);
  $('#talk').onclick=e=>{doHandoff(false)};
  $$('.sugg button').forEach(b=>b.onclick=()=>{$('#msg').value=b.dataset.s;$('#msg').focus()});
  const ta=$('#msg');ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#cf').requestSubmit()}});
  $('#cf').addEventListener('submit',e=>{e.preventDefault();const v=ta.value.trim();if(!v||busy)return;ta.value='';
    M.push(msg('CUSTOMER',v,'CUSTOMER_INPUT',[]));busy=true;draw(true);
    setTimeout(()=>{busy=false;reply(v);draw(true);
      if(pending&&M[M.length-1].proposal===pending){const rb=$('button[data-review="'+pending.proposal_id+'"]');openProposal(pending,rb||$('#send'))}
    },550)});
}

initMockbar();
$('#mock-state').addEventListener('change',()=>{if(typeof resetState==='function')resetState();render()});
render();
</script>
</body>
</html>
